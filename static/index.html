<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>⚔️ 롤 내전 경매</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&display=swap">
<style>
:root{
  /* ── 배경 ── */
  --bg-0:#04070c; --bg-1:#0a1420; --bg-2:#0e1c2e;
  --panel:rgba(7,14,24,.74); --panel-solid:#0b1520;
  --panel-hi:rgba(255,255,255,.03);
  /* ── 골드(헥스텍) 램프 ── */
  --gold-100:#F1E6C8; --gold-300:#D9B25C; --gold-400:#C89B3C; --gold-600:#8f6c26; --gold-900:#241a08;
  --gold-line:rgba(217,178,92,.28); --gold-line-soft:rgba(217,178,92,.14);
  /* ── 팀 컬러 ── */
  --cyan:#12D6C4; --cyan-dim:rgba(18,214,196,.12);
  --crimson:#EF4868; --crimson-dim:rgba(239,72,104,.12);
  --green:#20D375;
  /* ── 타이포 ── */
  --font-ui:'Pretendard Variable','Pretendard','Segoe UI',sans-serif;
  --font-display:'Cinzel','Pretendard Variable',serif;
  /* ── 그림자/이징 ── */
  --shadow-card:0 1px 0 var(--panel-hi) inset, 0 10px 28px rgba(0,0,0,.5), 0 0 0 1px rgba(0,0,0,.3);
  --ease:cubic-bezier(.2,.7,.3,1);
}

*{box-sizing:border-box;margin:0;padding:0}

::selection{background:rgba(217,178,92,.35);color:#fff}
*:focus-visible{outline:2px solid var(--gold-300);outline-offset:2px;border-radius:4px}

::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--bg-0)}
::-webkit-scrollbar-thumb{background:linear-gradient(var(--gold-600),var(--gold-900));border-radius:6px;border:2px solid var(--bg-0)}

body{
  font-family:var(--font-ui);
  background:
    radial-gradient(1100px 480px at 50% -8%, rgba(217,178,92,.10), transparent 60%),
    radial-gradient(900px 500px at 100% 100%, rgba(18,214,196,.05), transparent 55%),
    radial-gradient(900px 500px at 0% 100%, rgba(239,72,104,.05), transparent 55%),
    linear-gradient(180deg,var(--bg-1),var(--bg-0) 60%);
  background-attachment:fixed;
  color:var(--gold-400);min-height:100vh;padding:14px;
  letter-spacing:.1px;
}

h1{
  text-align:center;padding:20px 0 10px;font-size:1.7em;font-weight:800;
  color:var(--gold-100);letter-spacing:.4px;
  text-shadow:0 0 24px rgba(217,178,92,.45), 0 1px 0 rgba(0,0,0,.4);
}
h2{color:var(--gold-100);margin-bottom:12px;font-size:1.2em;font-weight:700}
h3{color:var(--gold-300);margin-bottom:8px;font-size:1em;font-weight:700;letter-spacing:.2px}

button{
  background:linear-gradient(180deg,#1b2129,#12161b);
  color:var(--gold-300);border:1px solid var(--gold-line);
  padding:11px 18px;border-radius:8px;font-size:.95em;font-weight:700;letter-spacing:.2px;
  cursor:pointer;transition:transform .15s var(--ease),box-shadow .2s var(--ease),
    background .2s var(--ease),color .2s var(--ease),border-color .2s var(--ease);
  width:100%;margin:3px 0;
  box-shadow:0 1px 0 rgba(255,255,255,.04) inset, 0 4px 12px rgba(0,0,0,.35);
}
button:hover{
  background:linear-gradient(180deg,var(--gold-300),var(--gold-600));
  color:#161311;border-color:var(--gold-100);
  box-shadow:0 0 0 1px var(--gold-line), 0 6px 20px rgba(217,178,92,.25);
  transform:translateY(-1px);
}
button:active{transform:translateY(0)}
button:disabled{opacity:.38;cursor:not-allowed;background:#12161b;color:#556;border-color:#333;
  transform:none;box-shadow:none}

input,select{
  background:#0a1421;color:var(--gold-300);border:1px solid var(--gold-line);
  padding:9px 12px;border-radius:7px;font-size:.95em;width:100%;margin:3px 0;
  transition:border-color .2s var(--ease),box-shadow .2s var(--ease);
}
input:hover,select:hover{border-color:var(--gold-line-soft)}
input:focus,select:focus{
  outline:none;border-color:var(--gold-300);
  box-shadow:0 0 0 3px rgba(217,178,92,.16);
}
input::placeholder{color:#4a5568}
label{color:var(--gold-300);font-size:.86em;font-weight:600;display:block;margin:6px 0 3px;letter-spacing:.2px}

.card{
  background:var(--panel);backdrop-filter:blur(6px);
  border:1px solid var(--gold-line);border-radius:14px;padding:18px;margin:10px 0;
  box-shadow:var(--shadow-card);
  position:relative;
}
.card::before{
  content:'';position:absolute;inset:0;border-radius:14px;padding:1px;pointer-events:none;
  background:linear-gradient(160deg,rgba(217,178,92,.28),transparent 30%,transparent 70%,rgba(217,178,92,.1));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
}
.row{display:flex;gap:8px}
.col{flex:1}
.blue{color:var(--cyan)}
.red{color:var(--crimson)}
.gold{color:var(--gold-300)}
.gray{color:#8a94a3}

.tag{display:inline-block;padding:3px 9px;border-radius:5px;font-size:.78em;font-weight:700;letter-spacing:.2px}
.tag-blue{border:1px solid var(--cyan);color:var(--cyan);background:var(--cyan-dim)}
.tag-red{border:1px solid var(--crimson);color:var(--crimson);background:var(--crimson-dim)}
.tag-gold{border:1px solid var(--gold-300);color:var(--gold-300);background:rgba(217,178,92,.1)}
.tag-gray{border:1px solid #444;color:#8a94a3}

/* Player card */
.pcard{display:flex;align-items:center;justify-content:space-between;
  padding:12px 14px;border-radius:9px;margin:6px 0;font-weight:700;font-size:.97em;min-height:46px;
  transition:transform .15s var(--ease),box-shadow .2s var(--ease);
  box-shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 3px 10px rgba(0,0,0,.3);
}
.pcard-a{border:1.5px solid var(--cyan);background:linear-gradient(180deg,var(--cyan-dim),rgba(18,214,196,.03));color:var(--cyan)}
.pcard-b{border:1.5px solid var(--crimson);background:linear-gradient(180deg,var(--crimson-dim),rgba(239,72,104,.03));color:var(--crimson)}
.pcard-empty{border:1px dashed #33404f;color:#4a5568;justify-content:center;font-style:italic;box-shadow:none}
.pcard-sel{border:1.5px solid var(--gold-300)!important;background:rgba(217,178,92,.16)!important;cursor:pointer;
  box-shadow:0 0 0 2px var(--gold-line-soft)!important}
.pcard[onclick]{cursor:pointer}
.pcard[onclick]:hover{transform:translateY(-1px)}
.pcard button{width:auto;padding:2px 8px;font-size:.8em;margin:0 0 0 6px}

/* Timer */
.timer-box{border-radius:10px;padding:13px;text-align:center;margin-bottom:10px;
  border:1.5px solid var(--green);background:rgba(32,211,117,.05)}
.timer-num{font-family:var(--font-display);font-size:2.2em;font-weight:900;letter-spacing:.5px}
.timer-bar{background:#1a2230;border-radius:4px;height:6px;margin-top:8px;overflow:hidden}
.timer-fill{height:100%;border-radius:4px;transition:width .5s,background .5s}

/* Auction target */
.target-box{background:radial-gradient(circle,rgba(217,178,92,.14),transparent 70%);
  padding:18px;text-align:center;border-bottom:1px solid var(--gold-line);margin-bottom:10px}
.target-name{font-family:var(--font-display);font-size:2.3em;font-weight:900;color:var(--gold-100);
  text-shadow:0 0 26px rgba(217,178,92,.6);letter-spacing:.5px}

/* Bid area */
.bid-area{background:var(--panel);border:1px solid var(--gold-line);border-radius:12px;padding:15px;margin:8px 0;
  box-shadow:var(--shadow-card)}
.bid-status{text-align:center;padding:12px;border-radius:9px;margin:4px 0;font-weight:700;font-size:1em}
.bid-waiting{border:1px dashed #3a4656;color:#8a94a3}
.bid-done{border:1px solid var(--green);color:var(--green);background:rgba(32,211,117,.07)}
.bid-reveal{font-family:var(--font-display);font-size:1.4em;padding:14px;border-radius:9px;text-align:center;
  border:1.5px solid var(--gold-300);background:rgba(217,178,92,.1);margin:6px 0;animation:pop .3s ease}
@keyframes pop{from{transform:scale(.95);opacity:.6}to{transform:scale(1);opacity:1}}
@keyframes pulse-danger{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.05);opacity:.8}}
@keyframes slide-left{from{transform:translateX(-24px);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes slide-right{from{transform:translateX(24px);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes winner-glow{0%{box-shadow:0 0 0 rgba(32,211,117,0)}60%{box-shadow:0 0 28px rgba(32,211,117,.75)}100%{box-shadow:0 0 12px rgba(32,211,117,.35)}}
@keyframes toast-in{from{top:0;opacity:0}to{top:24px;opacity:1}}
.timer-danger{animation:pulse-danger .6s ease-in-out infinite}

/* History */
.hist-item{padding:6px 10px;border-radius:6px;margin:3px 0;font-size:.82em;font-weight:600;border-left:3px solid;
  background:rgba(255,255,255,.015)}
.hist-blue{border-color:var(--cyan);background:var(--cyan-dim)}
.hist-red{border-color:var(--crimson);background:var(--crimson-dim)}
.hist-tie{border-color:var(--gold-300);background:rgba(217,178,92,.06)}

/* Trade status */
.trade-status{text-align:center;padding:13px;border-radius:9px;border:1.5px solid var(--gold-300);
  margin:8px 0;font-weight:700;background:rgba(217,178,92,.05)}

/* Room code display */
.room-code{font-family:var(--font-display);font-size:2.7em;font-weight:900;letter-spacing:7px;text-align:center;
  padding:18px;border:1.5px solid var(--gold-300);border-radius:12px;color:var(--gold-100);
  text-shadow:0 0 18px rgba(217,178,92,.6);margin:10px 0;background:rgba(217,178,92,.05)}

/* Roles */
.role-dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;
  box-shadow:0 0 8px currentColor}

/* Setup table */
table{width:100%;border-collapse:collapse;font-size:.85em}
th{background:#0a1420;color:var(--gold-300);padding:9px 8px;text-align:left;
  border:1px solid var(--gold-line-soft);font-weight:700;letter-spacing:.2px}
td{padding:5px 6px;border:1px solid rgba(217,178,92,.1)}
td input,td select{margin:0;padding:6px 8px;font-size:.85em}

/* Grid layout for auction */
.auction-grid{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:14px;max-width:1200px;margin:0 auto}
@media(max-width:800px){.auction-grid{grid-template-columns:1fr}}
.section-title{font-size:.95em;font-weight:800;margin-bottom:10px;padding-bottom:6px;
  border-bottom:1px solid var(--gold-line);letter-spacing:.3px;text-transform:uppercase}
.metric{background:var(--panel-solid);border:1px solid var(--gold-line);border-radius:9px;
  padding:10px 12px;margin-bottom:8px;text-align:center;box-shadow:var(--shadow-card)}
.metric .val{font-family:var(--font-display);font-size:1.3em;font-weight:900}
.metric .lbl{font-size:.72em;color:#7c8798;letter-spacing:.6px;text-transform:uppercase}

/* Custom tooltip */
.tip-wrap{position:relative;display:inline-flex;align-items:center}
.tip-box{display:none;position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);
  background:var(--panel-solid);border:1px solid var(--gold-300);border-radius:8px;padding:10px 13px;
  color:var(--gold-100);font-size:.8em;line-height:1.55;white-space:normal;width:210px;
  z-index:200;pointer-events:none;font-weight:400;text-align:left;
  box-shadow:0 8px 22px rgba(0,0,0,.6)}
.tip-box::after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);
  border:6px solid transparent;border-top-color:var(--gold-300)}
.tip-wrap:hover .tip-box,.tip-wrap.open .tip-box{display:block}
</style>
</head>
<body>
<div id="app"><!-- JS renders here --></div>
<script>
const TIERS=['언랭','아이언','브론즈','실버','골드','플래티넘','에메랄드','다이아','마스터','그랜드마스터','챌린저'];
const POSITIONS=['미정','탑','정글','미드','원딜','서폿'];
const POS_ICON={미정:'❓',탑:'🛡️',정글:'🌿',미드:'⚡',원딜:'🏹',서폿:'💙'};
const TIER_COLOR={언랭:'#888',아이언:'#8B6355',브론즈:'#AD5600',실버:'#A0A9B8',골드:'#C89B3C',
  플래티넘:'#00B4A0',에메랄드:'#00C060',다이아:'#576BCE',마스터:'#9D4DC3',그랜드마스터:'#CF3F3F',챌린저:'#F4C874'};

let ws=null, myRole=null, myRoom=null, gs=null;

// 렌더 전후 폼 상태 보존용
let _ui = {bid:'', dd:false, details:{}, focused:null};

function _saveUI(){
  const inp = document.getElementById('bid-input');
  const chk = document.getElementById('dd-chk');
  if(inp) _ui.bid = inp.value;
  if(chk) _ui.dd  = chk.checked;
  _ui.focused = document.activeElement ? document.activeElement.id : null;
  document.querySelectorAll('details[id]').forEach(d => {
    _ui.details[d.id] = d.open;
  });
}

function _restoreUI(){
  const inp = document.getElementById('bid-input');
  const chk = document.getElementById('dd-chk');
  if(inp && _ui.bid !== undefined) inp.value = _ui.bid;
  if(chk) chk.checked = _ui.dd;
  document.querySelectorAll('details[id]').forEach(d => {
    if(_ui.details[d.id] !== undefined) d.open = _ui.details[d.id];
  });
  // 포커스 복원
  if(_ui.focused){
    const el = document.getElementById(_ui.focused);
    if(el){
      el.focus();
      if(el.tagName==='INPUT' && el.type!=='checkbox'){
        const len = el.value.length;
        el.setSelectionRange(len, len);
      }
      return;
    }
  }
  // 내 차례가 처음 시작될 때 입찰 입력창 자동 포커스
  const bidInp = document.getElementById('bid-input');
  if(bidInp && gs?.bid_turn === myRole && !gs?.resolving) bidInp.focus();
}

const A = id => document.getElementById(id);
function send(type,data={}){
  if(ws && ws.readyState===1) ws.send(JSON.stringify({type,...data}));
}

function hexToRgb(hex){
  const r=/^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
  return r ? `${parseInt(r[1],16)},${parseInt(r[2],16)},${parseInt(r[3],16)}` : '136,136,136';
}

function copyCode(code){
  navigator.clipboard.writeText(code).then(()=>{
    const el=document.createElement('div');
    el.textContent='📋 방 코드 복사됨!';
    el.style.cssText='position:fixed;top:24px;left:50%;transform:translateX(-50%);background:#00C060;color:#000;padding:9px 20px;border-radius:8px;font-weight:700;z-index:9999;animation:toast-in .25s ease,pop .25s ease';
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),1800);
  });
}

function pauseTimer(){
  send(gs?.paused ? 'resume_timer' : 'pause_timer');
}

function passBid(){
  if(!confirm('정말 포기하시겠습니까?')) return;
  send('pass_bid');
}

function goHome(){
  if(!confirm('홈으로 돌아가면 현재 게임에서 나가집니다. 계속하시겠습니까?')) return;
  if(_reconn.timer){ clearTimeout(_reconn.timer); _reconn.timer=null; }
  _reconn = {active:false, attempts:0, timer:null};
  document.getElementById('reconn-banner')?.remove();
  if(ws) ws.close();
  ws=null; gs=null; myRole=null; myRoom=null;
  _ui={bid:'', dd:false, details:{}, focused:null};
  renderHome();
}

// ── localStorage 설정 저장/복원 ──────────────────────────────────────────
function _saveSetup(){
  try{
    const d={cfg:{},players:[]};
    ['cfg-sp','cfg-tie','cfg-timer'].forEach(id=>{const e=A(id);if(e)d.cfg[id]=e.value;});
    for(let i=0;i<10;i++) d.players.push({
      name:(A(`pn${i}`)?.value||''),
      tier:(A(`pt${i}`)?.value||'언랭'),
      pos:(A(`pp${i}`)?.value||'미정'),
    });
    localStorage.setItem('lol_setup',JSON.stringify(d));
  }catch(e){}
}
function _loadSetup(){
  try{
    const raw=localStorage.getItem('lol_setup');
    if(!raw)return;
    const d=JSON.parse(raw);
    if(d.cfg) Object.entries(d.cfg).forEach(([id,v])=>{const e=A(id);if(e)e.value=v;});
    if(d.players) d.players.forEach((p,i)=>{
      if(A(`pn${i}`))A(`pn${i}`).value=p.name||'';
      if(A(`pt${i}`))A(`pt${i}`).value=p.tier||'언랭';
      if(A(`pp${i}`))A(`pp${i}`).value=p.pos||'미정';
    });
  }catch(e){}
}

// ── 연결 ──────────────────────────────────────────────────────────────────
async function createRoom(){
  const r = await fetch('/api/room',{method:'POST'}).then(r=>r.json());
  myRoom = r.room_id; myRole = 'blue';
  connect();
}

function joinRoom(){
  const code = (A('code-in').value||'').trim().toUpperCase();
  const role = A('role-sel').value;
  if(!code || !role){ alert('방 코드와 역할을 선택해주세요.'); return; }
  myRoom = code; myRole = role;
  connect();
}

let _reconn = {active:false, attempts:0, timer:null};

function _onWsMsg(e){
  const msg = JSON.parse(e.data);
  if(msg.type==='state'){
    if(msg.timer_only){
      gs.timer = msg.d.timer;
      const tEl = document.getElementById('timer-display');
      if(tEl) tEl.innerHTML = buildTimerHtml(gs.timer);
      return;
    }
    document.getElementById('reconn-banner')?.remove();
    _reconn = {active:false, attempts:0, timer:null};
    _saveUI();
    gs=msg.d; myRole=msg.role;
    render();
    _restoreUI();
  }
  else if(msg.type==='error'){ alert(msg.msg); ws=null; gs=null; renderHome(); }
}

function _onWsClose(){
  if(gs && myRoom && myRole && myRole !== 'spectator') _scheduleReconnect();
  else { gs=null; renderHome(); }
}

function _scheduleReconnect(){
  if(_reconn.active) return;
  _reconn.active = true;
  _reconn.attempts = 0;
  _doReconnect();
}

function _doReconnect(){
  if(_reconn.timer){ clearTimeout(_reconn.timer); _reconn.timer=null; }
  _reconn.attempts++;
  if(_reconn.attempts > 5){
    document.getElementById('reconn-banner')?.remove();
    _reconn = {active:false, attempts:0, timer:null};
    gs=null; renderHome(); return;
  }
  let banner = document.getElementById('reconn-banner');
  if(!banner){
    banner = document.createElement('div');
    banner.id = 'reconn-banner';
    banner.style.cssText = 'position:fixed;top:0;left:0;right:0;background:rgba(200,155,60,.12);border-bottom:1px solid #C89B3C44;color:#C89B3C;text-align:center;padding:7px;font-weight:700;z-index:9999;font-size:.88em';
    document.body.prepend(banner);
  }
  const delay = Math.min(1500 * _reconn.attempts, 8000);
  banner.textContent = `🔄 연결 끊김 — ${Math.round(delay/1000)}초 후 재연결 시도 (${_reconn.attempts}/5)`;
  _reconn.timer = setTimeout(()=>{ _reconn.timer=null; connect(); }, delay);
}

function connect(){
  const proto = location.protocol==='https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${proto}//${location.host}/ws/${myRoom}/${myRole}`);
  ws.onmessage = _onWsMsg;
  ws.onclose   = _onWsClose;
  ws.onerror   = () => {};
}

// ── 렌더 라우팅 ───────────────────────────────────────────────────────────
function render(){
  if(!gs){ renderHome(); return; }
  const ph = gs.phase;
  if(ph==='lobby') renderLobby();
  else if(ph==='setup') { if(myRole==='blue') renderSetup(); else renderWaiting(); }
  else if(ph==='auction') renderAuction();
  else if(ph==='result') renderResult();
}

// ── 홈 ────────────────────────────────────────────────────────────────────
function renderHome(){
  document.getElementById('app').innerHTML=`
  <h1>⚔️ 롤 내전 경매 시스템</h1>
  <div style="max-width:420px;margin:0 auto">
    <div class="card">
      <button onclick="createRoom()">🏠 새 방 만들기 (블루팀 팀장)</button>
    </div>
    <div class="card">
      <h3 style="margin-bottom:8px">기존 방 참가</h3>
      <label>방 코드</label>
      <input id="code-in" placeholder="예: AB3K7P" maxlength="6"
        style="text-transform:uppercase;letter-spacing:4px;font-size:1.2em;text-align:center">

function renderSetup(){

      <td><span style="color:#888;font-size:.8em">${i+1}</span></td>
      <td><input id="pn${i}" placeholder="소환사명"></td>
      <td><select id="pt${i}">${tOpts}</select></td>
      <td><select id="pp${i}">${pOpts}</select></td>
    </tr>`;
  }
  document.getElementById('app').innerHTML=`
  <h1>⚔️ 드래프트 설정</h1>
  <div style="max-width:800px;margin:0 auto">
    <div class="card">
      <h3>⚙️ 게임 설정</h3>
      <div class="row">
        <div class="col">
          <label>💰 시작 포인트</label>
          <select id="cfg-sp">
            ${[50,70,100,120,150,200].map(v=>`<option ${v===100?'selected':''}>${v}</option>`).join('')}
          </select>
        </div>
        <div class="col">
          <label>⚔️ 동점 처리</label>
          <select id="cfg-tie">
            <option value="random">랜덤 결정</option>
            <option value="reshuffle">뒤로 이동</option>
          </select>
        </div>
        <div class="col">
          <label>⏱️ 타이머 (초)</label>
          <select id="cfg-timer">
            ${[10,15,20,30,45,60].map(v=>`<option ${v===30?'selected':''}>${v}</option>`).join('')}
          </select>
        </div>
      </div>
    </div>
    <div class="card">
      <h3>👥 선수 등록 (10명)</h3>
      <table>
        <thead><tr><th>#</th><th>소환사명</th><th>티어</th><th>포지션</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    <div class="card" id="leader-area" style="display:none">
      <h3>🏆 팀장 선택</h3>
      <div class="row">
        <div class="col">
          <label>🔵 블루팀 팀장</label>
          <select id="la"></select>
        </div>
        <div class="col">
          <label>🔴 레드팀 팀장</label>
          <select id="lb"></select>
        </div>
      </div>
    </div>
    <div class="card">
      <div id="setup-status" style="color:#aaa;font-size:.9em;margin-bottom:6px">
        소환사명을 10명 입력하면 팀장 선택이 활성화됩니다.
      </div>
      <button id="start-btn" onclick="startGame()" disabled>🚀 드래프트 시작 (LOCK IN)</button>
    </div>
  </div>`;

  // 이름 입력 감시 + 자동 저장
  for(let i=0;i<10;i++){
    A(`pn${i}`).addEventListener('input', updateLeaders);
    A(`pn${i}`).addEventListener('input', _saveSetup);
    A(`pt${i}`).addEventListener('change', _saveSetup);
    A(`pp${i}`).addEventListener('change', _saveSetup);
  }
  ['cfg-sp','cfg-tie','cfg-timer'].forEach(id=>A(id)?.addEventListener('change',_saveSetup));
  _loadSetup();
  updateLeaders();
}

function updateLeaders(){
  const names = [];
  for(let i=0;i<10;i++){
    const n=(A(`pn${i}`).value||'').trim();
    if(n) names.push(n);
  }
  const dup = names.length !== new Set(names).size;
  const ok  = names.length===10 && !dup;

  A('setup-status').textContent = dup ? '⚠️ 중복된 소환사명이 있습니다.' :
    `${names.length}/10명 입력됨`;

  if(ok){
    A('leader-area').style.display='block';
    const laEl=A('la'), lbEl=A('lb');
    const prev_a=laEl.value, prev_b=lbEl.value;
    laEl.innerHTML = names.map(n=>`<option>${n}</option>`).join('');
    lbEl.innerHTML = names.map(n=>`<option>${n}</option>`).join('');
    if(names.includes(prev_a)) laEl.value=prev_a;
    if(names.includes(prev_b)) lbEl.value=prev_b;
    A('start-btn').disabled=false;
  } else {
    A('leader-area').style.display='none';
    A('start-btn').disabled=true;
  }
}

function startGame(){
  const players=[];
  for(let i=0;i<10;i++){
    const n=(A(`pn${i}`).value||'').trim();
    if(!n) return;
    players.push({name:n, tier:A(`pt${i}`).value, position:A(`pp${i}`).value});
  }
  const la=A('la').value, lb=A('lb').value;
  if(la===lb){ alert('팀장이 같습니다.'); return; }
  send('start_game',{
    players, leader_a:la, leader_b:lb,
    cfg:{
      sp:    parseInt(A('cfg-sp').value),
      tie:   A('cfg-tie').value,
      timer: parseInt(A('cfg-timer').value),
    }
  });
}

// ── 타이머 HTML 빌더 (부분 업데이트용으로 분리) ──────────────────────────
function buildTimerHtml(rem){
  const maxTimer = gs?.cfg?.timer || 30;
  const paused   = gs?.paused;
  const pct      = Math.round(100*rem/maxTimer);
  const danger   = !paused && rem <= 10 && rem > 0;
  const tcolor   = paused ? '#555' : rem > maxTimer*.5 ? '#00C060' : rem > maxTimer*.2 ? '#C89B3C' : '#CF3F3F';
  const label    = paused ? `⏸️ ${rem}s (일시정지)` : `⏱️ ${rem}s`;
  const numSize  = danger ? '2.8em' : '2.2em';
  return `<div class="timer-box${danger?' timer-danger':''}" style="border-color:${tcolor}${danger?';border-width:3px':''}">
    <div class="timer-num" style="color:${tcolor};font-size:${numSize};transition:font-size .2s">${label}</div>
    <div class="timer-bar">
      <div class="timer-fill" style="width:${pct}%;background:${tcolor}"></div>
    </div>
  </div>`;
}

function renderAuction(){

function buildBidArea(){
  const sp = gs.cfg?.sp || 100;
  const pa = gs.team_a?.points ?? sp;
  const pb = gs.team_b?.points ?? sp;
  const aPassed = gs.bid_a_passed;
  const bPassed = gs.bid_b_passed;
  const aVal    = gs.bid_a;   // null = 미입찰
  const bVal    = gs.bid_b;

  // 현재 입찰 현황 (항상 표시)
  const aLabel = aPassed ? '❌ 포기' : aVal !== null ? `${aVal}pt` : '-';
  const bLabel = bPassed ? '❌ 포기' : bVal !== null ? `${bVal}pt` : '-';

  // ── 낙찰 결과 표시 중 ──
  if(gs.resolving){
    const winner = (aPassed && bPassed) ? 'tie'
      : aPassed ? 'red' : bPassed ? 'blue'
      : (aVal??0) > (bVal??0) ? 'blue' : (bVal??0) > (aVal??0) ? 'red' : 'tie';
    const aGlow = winner==='blue'?'animation:winner-glow .7s ease forwards;border-color:#00C060;border-width:3px':winner==='red'?'opacity:.45':'';
    const bGlow = winner==='red'?'animation:winner-glow .7s ease forwards;border-color:#00C060;border-width:3px':winner==='blue'?'opacity:.45':'';
    return `
    <div class="bid-area" style="border-color:#C89B3C">
      <div style="text-align:center;color:#aaa;font-size:.85em;margin-bottom:8px">📢 낙찰 결과</div>
      <div class="row" style="align-items:center">
        <div class="bid-reveal blue" style="animation:slide-left .3s ease;${aGlow}">
          🔵 ${aLabel}${winner==='blue'?' 👑':''}
        </div>
        <div style="display:flex;align-items:center;padding:0 8px;color:#888;font-size:1.1em;font-weight:900;flex-shrink:0">vs</div>
        <div class="bid-reveal red" style="animation:slide-right .3s ease;${bGlow}">
          🔴 ${bLabel}${winner==='red'?' 👑':''}
        </div>
      </div>
      ${winner==='tie'?`<div style="text-align:center;color:#C89B3C;margin-top:8px;font-weight:700">⚔️ 동점!</div>`:''}
    </div>`;
  }

  // 현황 바 (입찰 진행 중 항상 표시)
  const standingsHtml = `
  <div class="row" style="margin-bottom:8px;align-items:center">
    <div class="bid-reveal blue" style="font-size:1em;padding:8px">🔵 ${aLabel}</div>
    <div style="display:flex;align-items:center;padding:0 6px;color:#555;font-weight:900;flex-shrink:0">vs</div>
    <div class="bid-reveal red" style="font-size:1em;padding:8px">🔴 ${bLabel}</div>
  </div>`;

  const isMyTurn = gs.bid_turn === myRole;
  const myPts    = myRole==='blue' ? pa : pb;

  // ── 관전자 ──
  if(myRole === 'spectator'){
    const who = gs.bid_turn==='blue'?'🔵 블루팀':'🔴 레드팀';
    return `<div class="bid-area">${standingsHtml}
      <div class="bid-status bid-waiting">⏳ ${who} 결정 중...</div>
    </div>`;
  }

  // ── 내 차례 ──
  if(isMyTurn){
    const color = myRole==='blue'?'#0AC8B9':'#E91E63';
    return `
    <div class="bid-area">
      ${standingsHtml}
      <div style="color:${color};font-size:.9em;font-weight:700;text-align:center;margin-bottom:6px">⚡ 당신의 차례!</div>
      ${buildMyBidInput(myRole, myPts)}
      <button onclick="passBid()" style="margin-top:6px;border-color:#555;color:#888;font-size:.9em">❌ 포기하기</button>
    </div>`;
  }

  // ── 상대 차례 ──
  const waitFor = gs.bid_turn==='blue'?'🔵 블루팀':'🔴 레드팀';
  return `
  <div class="bid-area">
    ${standingsHtml}
    <div class="bid-status bid-waiting">⏳ ${waitFor} 결정 중...</div>
  </div>`;
}

function buildMyBidInput(team, pts){
  const color  = team==='blue'?'#0AC8B9':'#E91E63';
  const oppBid = team==='blue' ? gs.bid_b : gs.bid_a;
  const minBid = (oppBid !== null && oppBid !== undefined) ? oppBid+1 : 1;
  const hint   = (oppBid !== null && oppBid !== undefined)
    ? ` &nbsp;·&nbsp; 최소: <b style="color:#fff">${minBid}pt</b>` : '';
  return `
  <div>
    <div style="color:${color};font-size:.85em;margin-bottom:4px">잔여: ${pts}G${hint}</div>
    <input id="bid-input" type="number" min="${minBid}" max="${pts}" placeholder="${minBid} ~ ${pts}"
      onkeydown="if(event.key==='Enter')submitBid()"
      style="color:${color};border-color:${color};text-align:center;font-size:1.1em">
    <button onclick="submitBid()" style="margin-top:8px;border-color:${color};color:${color}">
      ⚡ 입찰 확정
    </button>
  </div>`;
}

function submitBid(){
  const input = A('bid-input');
  if(!input) return;
  const amt    = parseInt(input.value);
  const pts    = myRole==='blue' ? (gs?.team_a?.points ?? 0) : (gs?.team_b?.points ?? 0);
  const oppBid = myRole==='blue' ? gs?.bid_b : gs?.bid_a;
  const minBid = (oppBid !== null && oppBid !== undefined) ? oppBid+1 : 1;
  if(isNaN(amt) || amt < minBid){ alert(`${minBid}pt 이상 입찰해야 합니다.`); return; }
  if(amt > pts){ alert(`잔여 포인트(${pts}G)를 초과할 수 없습니다.`); return; }
  send('submit_bid',{amount:amt});
}

function buildTeamPanel(team){
  const t       = team==='a' ? gs.team_a : gs.team_b;
  const color   = team==='a' ? '#0AC8B9' : '#E91E63';
  const name    = team==='a' ? '🔵 BLUE TEAM' : '🔴 RED TEAM';
  const cls     = team==='a' ? 'pcard-a' : 'pcard-b';
  const sp      = gs.cfg?.sp || 100;
  const pts     = t?.points ?? sp;
  const spent   = sp - pts;
  const members = t?.members || [];
  let cards='';
  for(let i=0;i<5;i++){
    if(i<members.length){
      const m = members[i];
      const d = (gs.all_players||{})[m]||{tier:'언랭',position:'미정'};
      const tc= TIER_COLOR[d.tier]||'#888';
      const pi= POS_ICON[d.position]||'❓';
      const isLeader = i===0;
      const tierBg = `rgba(${hexToRgb(tc)},${isLeader?.13:.07})`;
      const leaderStyle = isLeader
        ? `border-width:3px;background:${tierBg};box-shadow:0 0 10px rgba(${hexToRgb(tc)},.2)`
        : `background:${tierBg}`;
      cards+=`<div class="pcard ${cls}" style="${leaderStyle}">
        <span style="min-width:24px;font-size:${isLeader?'1em':'.85em'}">${isLeader?'👑':i}</span>
        <span style="flex:1;margin:0 6px;font-size:${isLeader?'1.05em':'.97em'}">${m}</span>
        <span style="color:${tc};font-size:.78em;margin-right:4px;font-weight:700">${d.tier}</span>
        <span style="font-size:.85em;color:#aaa">${pi}</span>
      </div>`;
    } else {
      cards+=`<div class="pcard pcard-empty">Empty Slot</div>`;
    }
  }

  return `
  <div>
    <div class="section-title" style="color:${color}">${name}</div>
    <div class="metric">
      <div class="lbl">GOLD</div>
      <div class="val" style="color:${color}">${pts}G</div>
      <div style="background:#1a1a2e;border-radius:3px;height:6px;margin:5px 0 2px;overflow:hidden">
        <div style="width:${Math.round(100*pts/sp)}%;height:100%;background:${color};border-radius:3px;transition:width .6s"></div>
      </div>
      ${spent>0?`<div style="font-size:.75em;color:#aaa">-${spent} 소모</div>`:''}
    </div>
    ${cards}
  </div>`;
}

// ── 결과 ──────────────────────────────────────────────────────────────────
function renderResult(){
  const trade   = gs.trade;
  const selA    = gs.sel_a || [];
  const selB    = gs.sel_b || [];
  const canSwap = selA.length===selB.length && selA.length>0;

  const teamA = buildResultTeam('a', trade);
  const teamB = buildResultTeam('b', trade);

  let tradeCenter;
  if(trade){
    const bcolor = canSwap ? '#00C060' : '#C89B3C';
    const txt = canSwap
      ? `🔵 ${selA.length}명 ↔ 🔴 ${selB.length}명  ✅ 교환 가능!`
      : `🔵 ${selA.length}명 선택 ↔ 🔴 ${selB.length}명 선택  (수를 맞춰주세요)`;
    tradeCenter=`
    <div class="trade-status" style="border-color:${bcolor};color:${bcolor}">${txt}</div>
    <div style="color:#aaa;font-size:.82em;text-align:center;margin-bottom:8px">
      양 팀 선수 카드를 클릭해 선택하세요
    </div>
    <button onclick="send('trade_confirm')" ${canSwap?'':'disabled'} style="margin-bottom:6px">
      ✅ 교환 확정
    </button>
    <button onclick="send('trade_cancel')" style="border-color:#888;color:#888">
      ❌ 취소
    </button>`;
  } else {
    tradeCenter=`
    <button onclick="send('trade_start')" style="margin-bottom:6px">🔄 트레이드 시작</button>
    <button onclick="send('reset')" style="border-color:#555;color:#555">🔁 새 게임</button>`;
  }

  const hist = (gs.history||[]).slice().reverse().map(h=>`
    <div class="hist-item hist-${h.type}">${h.result}</div>`).join('');

  document.getElementById('app').innerHTML=`
  <h1>🏆 드래프트 완료!</h1>
  <div style="text-align:center;margin-bottom:6px">
    <button onclick="goHome()"
      style="width:auto;padding:5px 16px;font-size:.82em;border-color:#555;color:#888">
      🏠 홈으로
    </button>
  </div>
  <div style="max-width:960px;margin:0 auto">
    <div class="auction-grid">
      ${teamA}
      <div>
        <div class="card">${tradeCenter}</div>
        ${hist?`
        <details class="card">
          <summary style="cursor:pointer;color:#aaa;font-size:.85em">📋 전체 경매 기록</summary>
          <div style="margin-top:8px">${hist}</div>
        </details>`:''}
      </div>
      ${teamB}
    </div>
  </div>`;
}

function buildResultTeam(team, tradeMode){
  const t      = team==='a' ? gs.team_a : gs.team_b;
  const color  = team==='a' ? '#0AC8B9' : '#E91E63';
  const name   = team==='a' ? '🔵 BLUE TEAM' : '🔴 RED TEAM';
  const cls    = team==='a' ? 'pcard-a' : 'pcard-b';
  const sel    = team==='a' ? (gs.sel_a||[]) : (gs.sel_b||[]);
  const sp     = gs.cfg?.sp || 100;
  const pts    = t?.points ?? sp;
  const spent  = sp - pts;
  const members= t?.members || [];

  let cards='';
  for(let i=0;i<members.length;i++){
    const m  = members[i];
    const d  = (gs.all_players||{})[m]||{tier:'언랭',position:'미정'};
    const tc = TIER_COLOR[d.tier]||'#888';
    const pi = POS_ICON[d.position]||'❓';
    const icon = i===0?'👑':String(i);
    const isSel = sel.includes(m);
    if(tradeMode){
      cards+=`<div class="pcard ${cls} ${isSel?'pcard-sel':''}"
        onclick="send('trade_toggle',{player:'${m}',team:'${team}'})"
        style="cursor:pointer">
        <span style="min-width:24px">${isSel?'✅':icon}</span>
        <span style="flex:1;margin:0 6px">${m}</span>
        <span style="color:${tc};font-size:.78em;margin-right:4px">${d.tier}</span>
        <span style="font-size:.8em;color:#aaa">${pi}${d.position}</span>
      </div>`;
    } else {
      cards+=`<div class="pcard ${cls}">
        <span style="min-width:24px">${icon}</span>
        <span style="flex:1;margin:0 6px">${m}</span>
        <span style="color:${tc};font-size:.78em;margin-right:4px">${d.tier}</span>
        <span style="font-size:.8em;color:#aaa">${pi}${d.position}</span>
      </div>`;
    }
  }

  return `
  <div>
    <div class="section-title" style="color:${color}">${name}</div>
    <div class="metric">
      <div class="lbl">최종 GOLD</div>
      <div class="val" style="color:${color}">${pts}G</div>
      ${spent>0?`<div style="font-size:.75em;color:#aaa">-${spent} 소모</div>`:''}
    </div>
    ${cards}
  </div>`;
}

// ── 밸런싱 모드 (라이엇 API 기반 자동 팀 구성) ─────────────────────────────
function renderBalanceSetup(){
  if(ws){ ws.close(); ws=null; gs=null; myRole=null; myRoom=null; }
  const pOpts = POSITIONS.map(p=>`<option>${p}</option>`).join('');
  const tOpts = TIERS.map(t=>`<option>${t}</option>`).join('');
  let rows='';
  for(let i=0;i<10;i++){
    rows+=`<tr>
      <td><span style="color:#888;font-size:.8em">${i+1}</span></td>
      <td><input id="bn${i}" placeholder="소환사명"></td>
      <td><input id="brid${i}" placeholder="게임명#태그"></td>
      <td><select id="bp${i}">${pOpts}</select></td>
      <td><select id="bt${i}">${tOpts}</select></td>
      <td id="binfo${i}" style="font-size:.78em;color:#888;white-space:nowrap">-</td>
    </tr>`;
  }
  document.getElementById('app').innerHTML=`
  <h1>🧮 밸런싱 모드</h1>
  <div style="max-width:1000px;margin:0 auto">
    <div class="card" style="color:#aaa;font-size:.86em">
      라이엇ID(예: Hide on bush#KR1)를 입력하고 전적을 조회하면 솔로랭크 티어·LP를 자동으로 불러옵니다.
      조회에 실패했거나 언랭인 경우 티어를 직접 선택해 보정할 수 있습니다.
    </div>
    <div class="card">
      <h3>👥 선수 등록 (10명)</h3>
      <div style="overflow-x:auto">
      <table>
        <thead><tr><th>#</th><th>소환사명</th><th>라이엇ID</th><th>포지션</th><th>티어</th><th>조회 결과</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      </div>
      <button id="lookup-btn" onclick="doLookup()" style="margin-top:10px">🔍 전적 조회</button>
    </div>
    <div class="card">
      <div id="bal-status" style="color:#aaa;font-size:.9em;margin-bottom:6px">
        소환사명·라이엇ID 10명을 입력하고 전적을 조회하세요.
      </div>
      <button id="compute-btn" onclick="doCompute()" disabled>🧮 팀 구성하기</button>
    </div>
    <div class="card" style="text-align:center">
      <button onclick="renderHome()" style="border-color:#555;color:#888;font-size:.9em">🏠 메인 화면으로</button>
    </div>
  </div>`;

  for(let i=0;i<10;i++){
    A(`bt${i}`).addEventListener('change', ()=>{
      const infoEl = A(`binfo${i}`);
      infoEl.dataset.rank=''; infoEl.dataset.lp='0';
      infoEl.innerHTML = `<span style="color:#C89B3C">✏️ 수동 설정</span>`;
    });
  }
}

async function doLookup(){
  const names=[], riotIds=[];
  for(let i=0;i<10;i++){
    const n=(A(`bn${i}`).value||'').trim();
    const r=(A(`brid${i}`).value||'').trim();
    if(!n || !r){ alert('모든 선수의 소환사명과 라이엇ID(게임명#태그)를 입력해주세요.'); return; }
    names.push(n); riotIds.push(r);
  }
  if(new Set(names).size !== 10){ alert('소환사명이 중복되었습니다.'); return; }

  const btn = A('lookup-btn');
  btn.disabled = true; btn.textContent = '🔄 조회 중... (수 초 소요)';
  try{
    const res = await fetch('/api/balance/lookup', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({players: names.map((n,i)=>({name:n, riot_id:riotIds[i]}))})
    });
    if(!res.ok){
      const e = await res.json().catch(()=>({}));
      alert('조회 실패: ' + (e.detail || res.status));
      return;
    }
    const data = await res.json();
    data.players.forEach((p,i)=>{
      const infoEl = A(`binfo${i}`);
      const tSel   = A(`bt${i}`);
      if(p.ok){
        tSel.value = p.tier_ko;
        infoEl.dataset.rank = p.rank || '';
        infoEl.dataset.lp   = String(p.lp || 0);
        const rk = p.rank ? ` ${p.rank}` : '';
        const wl = p.tier !== 'UNRANKED' ? ` · ${p.wins}승 ${p.losses}패` : '';
        infoEl.innerHTML = `<span style="color:${TIER_COLOR[p.tier_ko]||'#888'}">${p.tier_ko}${rk} ${p.lp}LP</span>${wl}`;
      } else {
        infoEl.dataset.rank=''; infoEl.dataset.lp='0';
        infoEl.innerHTML = `<span style="color:#CF3F3F">⚠️ ${p.error}</span>`;
      }
    });
    A('bal-status').textContent = '조회 완료. 필요하면 티어를 직접 수정한 뒤 팀을 구성하세요.';
    A('compute-btn').disabled = false;
  } finally {
    btn.disabled = false; btn.textContent = '🔍 전적 조회';
  }
}

async function doCompute(){
  const players=[];
  for(let i=0;i<10;i++){
    const name     = (A(`bn${i}`).value||'').trim();
    const position = A(`bp${i}`).value;
    const tier_ko  = A(`bt${i}`).value;
    const infoEl   = A(`binfo${i}`);
    const rank = infoEl.dataset.rank || null;
    const lp   = parseInt(infoEl.dataset.lp || '0') || 0;
    players.push({name, position, tier_ko, rank, lp});
  }
  const btn = A('compute-btn');
  btn.disabled = true; btn.textContent = '🔄 계산 중...';
  try{
    const res = await fetch('/api/balance/compute', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({players})
    });
    if(!res.ok){
      const e = await res.json().catch(()=>({}));
      alert('계산 실패: ' + (e.detail || res.status));
      return;
    }
    renderBalanceResult(await res.json());
  } finally {
    btn.disabled = false; btn.textContent = '🧮 팀 구성하기';
  }
}

function renderBalanceResult(result){
  const buildTeam = (team, totalScore, color, label) => {
    const cardCls = color === '#0AC8B9' ? 'pcard-a' : 'pcard-b';
    const cards = team.map(p=>{
      const tc = TIER_COLOR[p.tier_ko] || '#888';
      const pi = POS_ICON[p.assigned_position] || '❓';
      const mismatch = p.position !== '미정' && p.position !== p.assigned_position;
      return `<div class="pcard ${cardCls}">
        <span style="min-width:24px">${pi}</span>
        <span style="flex:1;margin:0 6px">${p.name}${mismatch?` <span style="color:#CF3F3F;font-size:.78em">(희망:${p.position})</span>`:''}</span>
        <span style="color:${tc};font-size:.78em;font-weight:700">${p.tier_ko}</span>
      </div>`;
    }).join('');
    return `<div>
      <div class="section-title" style="color:${color}">${label}</div>
      <div class="metric">
        <div class="lbl">팀 실력 점수 합</div>
        <div class="val" style="color:${color}">${totalScore}</div>
      </div>
      ${cards}
    </div>`;
  };

  const scoreDiff = Math.abs(result.score_a - result.score_b);
  document.getElementById('app').innerHTML=`
  <h1>🧮 밸런싱 결과</h1>
  <div style="max-width:960px;margin:0 auto">
    <div class="card" style="text-align:center">
      <span class="gray">포지션 희망 불일치 </span><b style="color:${result.mismatches?'#CF3F3F':'#00C060'}">${result.mismatches}건</b>
      &nbsp;|&nbsp;
      <span class="gray">팀 간 점수 차이 </span><b class="gold">${scoreDiff}</b>
    </div>
    <div class="auction-grid">
      ${buildTeam(result.team_a, result.score_a, '#0AC8B9', '🔵 BLUE TEAM')}
      <div class="card" style="display:flex;flex-direction:column;gap:8px;justify-content:center">
        <button onclick="renderBalanceSetup()">↩️ 선수 다시 설정</button>
        <button onclick="renderHome()" style="border-color:#555;color:#888">🏠 홈으로</button>
      </div>
      ${buildTeam(result.team_b, result.score_b, '#E91E63', '🔴 RED TEAM')}
    </div>
  </div>`;
}

// ── 초기 렌더 ─────────────────────────────────────────────────────────────
renderHome();
</script>
</body>
</html>
