<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>⚔️ 롤 내전 경매</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;background:linear-gradient(180deg,#091428,#0A0A0C);
  color:#C89B3C;min-height:100vh;padding:10px}
h1{text-align:center;padding:16px 0 8px;font-size:1.6em;text-shadow:0 0 10px rgba(200,155,60,.5)}
h2{color:#C89B3C;margin-bottom:12px;font-size:1.2em}
h3{color:#C89B3C;margin-bottom:8px;font-size:1em}
button{background:#1E2328;color:#C89B3C;border:2px solid #C89B3C;padding:10px 18px;
  border-radius:6px;font-size:.95em;font-weight:700;cursor:pointer;transition:.2s;width:100%;margin:3px 0}
button:hover{background:#C89B3C;color:#1E2328}
button:disabled{opacity:.4;cursor:not-allowed;background:#1E2328;color:#555;border-color:#555}
input,select{background:#0d1b2a;color:#C89B3C;border:1px solid #C89B3C;padding:8px 12px;
  border-radius:5px;font-size:.95em;width:100%;margin:3px 0}
input::placeholder{color:#555}
label{color:#C89B3C;font-size:.9em;font-weight:600;display:block;margin:6px 0 2px}
.card{background:rgba(1,10,19,.8);border:1px solid #C89B3C;border-radius:10px;padding:16px;margin:8px 0}
.row{display:flex;gap:8px}
.col{flex:1}
.blue{color:#0AC8B9}
.red{color:#E91E63}
.gold{color:#C89B3C}
.gray{color:#aaa}
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:.8em;font-weight:700}
.tag-blue{border:1px solid #0AC8B9;color:#0AC8B9}
.tag-red{border:1px solid #E91E63;color:#E91E63}
.tag-gold{border:1px solid #C89B3C;color:#C89B3C}
.tag-gray{border:1px solid #555;color:#555}
/* Player card */
.pcard{display:flex;align-items:center;justify-content:space-between;
  padding:12px 14px;border-radius:6px;margin:5px 0;font-weight:700;font-size:.97em;min-height:46px}
.pcard-a{border:2px solid #0AC8B9;background:rgba(10,200,185,.08);color:#0AC8B9}
.pcard-b{border:2px solid #E91E63;background:rgba(233,30,99,.08);color:#E91E63}
.pcard-empty{border:1px dashed #333;color:#444;justify-content:center;font-style:italic}
.pcard-sel{border:2px solid #C89B3C!important;background:rgba(200,155,60,.15)!important;cursor:pointer}
.pcard button{width:auto;padding:2px 8px;font-size:.8em;margin:0 0 0 6px}
/* Timer */
.timer-box{border-radius:8px;padding:12px;text-align:center;margin-bottom:10px;border:2px solid #00C060}
.timer-num{font-size:2.2em;font-weight:900}
.timer-bar{background:#333;border-radius:3px;height:6px;margin-top:6px}
.timer-fill{height:100%;border-radius:3px;transition:width .5s,background .5s}
/* Auction target */
.target-box{background:radial-gradient(circle,rgba(200,155,60,.12),transparent 70%);
  padding:16px;text-align:center;border-bottom:2px solid #C89B3C;margin-bottom:10px}
.target-name{font-size:2.4em;font-weight:900;color:#C89B3C;text-shadow:0 0 20px rgba(200,155,60,.7)}
/* Bid area */
.bid-area{background:rgba(1,10,19,.8);border:1px solid #C89B3C;border-radius:10px;padding:14px;margin:8px 0}
.bid-status{text-align:center;padding:12px;border-radius:8px;margin:4px 0;font-weight:700;font-size:1em}
.bid-waiting{border:1px dashed #555;color:#777}
.bid-done{border:1px solid #00C060;color:#00C060;background:rgba(0,192,96,.07)}
.bid-reveal{font-size:1.4em;padding:14px;border-radius:8px;text-align:center;
  border:2px solid #C89B3C;background:rgba(200,155,60,.1);margin:6px 0;animation:pop .3s ease}
@keyframes pop{from{transform:scale(.95);opacity:.6}to{transform:scale(1);opacity:1}}
@keyframes pulse-danger{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.05);opacity:.8}}
@keyframes slide-left{from{transform:translateX(-24px);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes slide-right{from{transform:translateX(24px);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes winner-glow{0%{box-shadow:0 0 0 rgba(0,192,96,0)}60%{box-shadow:0 0 28px rgba(0,192,96,.75)}100%{box-shadow:0 0 12px rgba(0,192,96,.35)}}
@keyframes toast-in{from{top:0;opacity:0}to{top:24px;opacity:1}}
.timer-danger{animation:pulse-danger .6s ease-in-out infinite}
/* History */
.hist-item{padding:5px 10px;border-radius:4px;margin:3px 0;font-size:.82em;font-weight:600;border-left:3px solid}
.hist-blue{border-color:#0AC8B9;background:rgba(10,200,185,.06)}
.hist-red{border-color:#E91E63;background:rgba(233,30,99,.06)}
.hist-tie{border-color:#C89B3C;background:rgba(200,155,60,.06)}
/* Trade status */
.trade-status{text-align:center;padding:12px;border-radius:8px;border:2px solid #C89B3C;
  margin:8px 0;font-weight:700}
/* Room code display */
.room-code{font-size:2.8em;font-weight:900;letter-spacing:6px;text-align:center;
  padding:16px;border:2px solid #C89B3C;border-radius:10px;color:#C89B3C;
  text-shadow:0 0 15px rgba(200,155,60,.6);margin:10px 0}
/* Roles */
.role-dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
/* Setup table */
table{width:100%;border-collapse:collapse;font-size:.85em}
th{background:#0d1b2a;color:#C89B3C;padding:8px;text-align:left;border:1px solid #C89B3C33}
td{padding:4px 6px;border:1px solid #C89B3C22}
td input,td select{margin:0;padding:5px 8px;font-size:.85em}
/* Grid layout for auction */
.auction-grid{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:12px;max-width:1200px;margin:0 auto}
@media(max-width:800px){.auction-grid{grid-template-columns:1fr}}
.section-title{font-size:.95em;font-weight:700;margin-bottom:8px;padding-bottom:4px;border-bottom:1px solid #C89B3C44}
.metric{background:rgba(1,10,19,.9);border:1px solid #C89B3C;border-radius:6px;
  padding:8px 12px;margin-bottom:8px;text-align:center}
.metric .val{font-size:1.3em;font-weight:900}
.metric .lbl{font-size:.75em;color:#888}
/* Custom tooltip */
.tip-wrap{position:relative;display:inline-flex;align-items:center}
.tip-box{display:none;position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);
  background:#0d1b2a;border:1px solid #C89B3C;border-radius:7px;padding:9px 12px;
  color:#C89B3C;font-size:.8em;line-height:1.5;white-space:normal;width:210px;
  z-index:200;pointer-events:none;font-weight:400;text-align:left;
  box-shadow:0 4px 16px rgba(0,0,0,.6)}
.tip-box::after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);
  border:6px solid transparent;border-top-color:#C89B3C}
.tip-wrap:hover .tip-box,.tip-wrap.open .tip-box{display:block}
</style>
</head>
<body>
<div id="app"><!-- JS renders here --></div>
<script>
const TIERS=['언랭','아이언','브론즈','실버','골드','플래티넘','에메랄드','다이아','마스터','그랜드마스터','챌린저'];
const POSITIONS=['미정','탑','정글','미드','원딜','서폿'];
const POS_ICON={미정:'❓',탑:'🛡️',정글:'🌿',미드:'⚡',원딜:'🏹',서폿:'💙'};
const TIER_COLOR={언랭:'#888',아이언:'#8B6355',브론즈:'#AD5600',실버:'#A0A9B8',골드:'#C89B3C',
  플래티넘:'#00B4A0',에메랄드:'#00C060',다이아:'#576BCE',마스터:'#9D4DC3',그랜드마스터:'#CF3F3F',챌린저:'#F4C874'};

let ws=null, myRole=null, myRoom=null, gs=null;

// 렌더 전후 폼 상태 보존용
let _ui = {bid:'', dd:false, details:{}, focused:null};

function _saveUI(){
  const inp = document.getElementById('bid-input');
  const chk = document.getElementById('dd-chk');
  if(inp) _ui.bid = inp.value;
  if(chk) _ui.dd  = chk.checked;
  _ui.focused = document.activeElement ? document.activeElement.id : null;
  document.querySelectorAll('details[id]').forEach(d => {
    _ui.details[d.id] = d.open;
  });
}

function _restoreUI(){
  const inp = document.getElementById('bid-input');
  const chk = document.getElementById('dd-chk');
  if(inp && _ui.bid !== undefined) inp.value = _ui.bid;
  if(chk) chk.checked = _ui.dd;
  document.querySelectorAll('details[id]').forEach(d => {
    if(_ui.details[d.id] !== undefined) d.open = _ui.details[d.id];
  });
  // 포커스 복원
  if(_ui.focused){
    const el = document.getElementById(_ui.focused);
    if(el){
      el.focus();
      if(el.tagName==='INPUT' && el.type!=='checkbox'){
        const len = el.value.length;
        el.setSelectionRange(len, len);
      }
    }
  }
}

const A = id => document.getElementById(id);
function send(type,data={}){
  if(ws && ws.readyState===1) ws.send(JSON.stringify({type,...data}));
}

function hexToRgb(hex){
  const r=/^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
  return r ? `${parseInt(r[1],16)},${parseInt(r[2],16)},${parseInt(r[3],16)}` : '136,136,136';
}

function copyCode(code){
  navigator.clipboard.writeText(code).then(()=>{
    const el=document.createElement('div');
    el.textContent='📋 방 코드 복사됨!';
    el.style.cssText='position:fixed;top:24px;left:50%;transform:translateX(-50%);background:#00C060;color:#000;padding:9px 20px;border-radius:8px;font-weight:700;z-index:9999;animation:toast-in .25s ease,pop .25s ease';
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),1800);
  });
}

function pauseTimer(){
  send(gs?.paused ? 'resume_timer' : 'pause_timer');
}

function passBid(){
  if(!confirm('정말 포기하시겠습니까?')) return;
  send('pass_bid');
}

function goHome(){
  if(!confirm('홈으로 돌아가면 현재 게임에서 나가집니다. 계속하시겠습니까?')) return;
  if(ws) ws.close();
  ws=null; gs=null; myRole=null; myRoom=null;
  _ui={bid:'', dd:false, details:{}, focused:null};
  renderHome();
}

// ── 연결 ──────────────────────────────────────────────────────────────────
async function createRoom(){
  const r = await fetch('/api/room',{method:'POST'}).then(r=>r.json());
  myRoom = r.room_id; myRole = 'blue';
  connect();
}

function joinRoom(){
  const code = (A('code-in').value||'').trim().toUpperCase();
  const role = A('role-sel').value;
  if(!code || !role){ alert('방 코드와 역할을 선택해주세요.'); return; }
  myRoom = code; myRole = role;
  connect();
}

function connect(){
  const proto = location.protocol==='https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${proto}//${location.host}/ws/${myRoom}/${myRole}`);
  ws.onmessage = e => {
    const msg = JSON.parse(e.data);
    if(msg.type==='state'){
      if(msg.timer_only){
        // 타이머만 변경 → 입력 폼 그대로, timer-display만 갱신
        gs.timer = msg.d.timer;
        const tEl = document.getElementById('timer-display');
        if(tEl) tEl.innerHTML = buildTimerHtml(gs.timer);
        return;
      }
      _saveUI();
      gs=msg.d; myRole=msg.role;
      render();
      _restoreUI();
    }
    else if(msg.type==='error'){ alert(msg.msg); ws=null; gs=null; renderHome(); }
  };
  ws.onclose = () => { if(gs){ gs=null; renderHome(); } };
  ws.onerror = () => { alert('연결 실패'); ws=null; gs=null; renderHome(); };
}

// ── 렌더 라우팅 ───────────────────────────────────────────────────────────
function render(){
  if(!gs){ renderHome(); return; }
  const ph = gs.phase;
  if(ph==='lobby') renderLobby();
  else if(ph==='setup') { if(myRole==='blue') renderSetup(); else renderWaiting(); }
  else if(ph==='auction') renderAuction();
  else if(ph==='result') renderResult();
}

// ── 홈 ────────────────────────────────────────────────────────────────────
function renderHome(){
  document.getElementById('app').innerHTML=`
  <h1>⚔️ 롤 내전 경매 시스템</h1>
  <div style="max-width:420px;margin:0 auto">
    <div class="card">
      <button onclick="createRoom()">🏠 새 방 만들기 (블루팀 팀장)</button>
    </div>
    <div class="card">
      <h3 style="margin-bottom:8px">기존 방 참가</h3>
      <label>방 코드</label>
      <input id="code-in" placeholder="예: AB3K7P" maxlength="6"
        style="text-transform:uppercase;letter-spacing:4px;font-size:1.2em;text-align:center">
      <label style="margin-top:10px">역할 선택</label>
      <select id="role-sel">
        <option value="">-- 선택 --</option>
        <option value="red">🔴 레드팀 팀장</option>
        <option value="spectator">👁️ 관전자</option>
      </select>
      <button onclick="joinRoom()" style="margin-top:8px">참가하기</button>
    </div>
  </div>`;
}

// ── 로비 ──────────────────────────────────────────────────────────────────
function renderLobby(){
  const conn = gs.connected || [];
  const hasBlue = conn.includes('blue');
  const hasRed  = conn.includes('red');
  const dot = (c,txt) => `<div style="margin:6px 0">
    <span class="role-dot" style="background:${c}"></span>
    <span style="color:${c}">${txt}</span>
  </div>`;

  const canStart = myRole==='blue' && hasBlue && hasRed;
  document.getElementById('app').innerHTML=`
  <h1>⚔️ 롤 내전 경매 시스템</h1>
  <div style="max-width:480px;margin:0 auto">
    <div class="card" style="text-align:center">
      <div style="font-size:.9em;color:#aaa;margin-bottom:4px">방 코드</div>
      <div class="room-code" onclick="copyCode('${gs.room_id}')"
        style="cursor:pointer;user-select:none" title="클릭하여 복사">
        ${gs.room_id}
      </div>
      <button onclick="copyCode('${gs.room_id}')"
        style="width:auto;padding:6px 20px;font-size:.85em;margin-top:6px;border-color:#555;color:#888">
        📋 코드 복사
      </button>
      <div style="font-size:.82em;color:#aaa;margin-top:6px">이 코드를 다른 팀원에게 공유하세요</div>
    </div>
    <div class="card">
      <h3>접속 현황</h3>
      ${dot('#0AC8B9', '🔵 블루팀 팀장 ' + (hasBlue?'✅ 접속됨':'⏳ 대기 중'))}
      ${dot('#E91E63', '🔴 레드팀 팀장 ' + (hasRed ?'✅ 접속됨':'⏳ 대기 중'))}
      ${conn.filter(r=>r==='spectator').length > 0 ? dot('#888','👁️ 관전자 접속됨') : ''}
    </div>
    ${canStart ? `
    <div class="card">
      <button onclick="goToSetup()" style="font-size:1.1em">🚀 드래프트 설정 시작</button>
    </div>` : myRole==='blue' ? `
    <div class="card" style="text-align:center;color:#888">
      레드팀 팀장 접속 대기 중...
    </div>` : `
    <div class="card" style="text-align:center;color:#888">
      블루팀 팀장이 설정을 시작할 때까지 대기...
    </div>`}
    <div class="card" style="text-align:center">
      <button onclick="goHome()"
        style="border-color:#555;color:#888;font-size:.9em">
        🏠 메인 화면으로
      </button>
    </div>
  </div>`;
}

function goToSetup(){
  // phase를 setup으로 전환 (블루팀 팀장만)
  document.getElementById('app').innerHTML='';
  renderSetup();
}

// ── 설정 ──────────────────────────────────────────────────────────────────
function renderSetup(){
  const tOpts = TIERS.map(t=>`<option>${t}</option>`).join('');
  const pOpts = POSITIONS.map(p=>`<option>${p}</option>`).join('');
  let rows='';
  for(let i=0;i<10;i++){
    rows+=`<tr>
      <td><span style="color:#888;font-size:.8em">${i+1}</span></td>
      <td><input id="pn${i}" placeholder="소환사명"></td>
      <td><select id="pt${i}">${tOpts}</select></td>
      <td><select id="pp${i}">${pOpts}</select></td>
    </tr>`;
  }
  document.getElementById('app').innerHTML=`
  <h1>⚔️ 드래프트 설정</h1>
  <div style="max-width:800px;margin:0 auto">
    <div class="card">
      <h3>⚙️ 게임 설정</h3>
      <div class="row">
        <div class="col">
          <label>💰 시작 포인트</label>
          <select id="cfg-sp">
            ${[50,70,100,120,150,200].map(v=>`<option ${v===100?'selected':''}>${v}</option>`).join('')}
          </select>
        </div>
        <div class="col">
          <label>⚔️ 동점 처리</label>
          <select id="cfg-tie">
            <option value="random">랜덤 결정</option>
            <option value="reshuffle">뒤로 이동</option>
          </select>
        </div>
        <div class="col">
          <label>⏱️ 타이머 (초)</label>
          <select id="cfg-timer">
            ${[10,15,20,30,45,60].map(v=>`<option ${v===30?'selected':''}>${v}</option>`).join('')}
          </select>
        </div>
      </div>
    </div>
    <div class="card">
      <h3>👥 선수 등록 (10명)</h3>
      <table>
        <thead><tr><th>#</th><th>소환사명</th><th>티어</th><th>포지션</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    <div class="card" id="leader-area" style="display:none">
      <h3>🏆 팀장 선택</h3>
      <div class="row">
        <div class="col">
          <label>🔵 블루팀 팀장</label>
          <select id="la"></select>
        </div>
        <div class="col">
          <label>🔴 레드팀 팀장</label>
          <select id="lb"></select>
        </div>
      </div>
    </div>
    <div class="card">
      <div id="setup-status" style="color:#aaa;font-size:.9em;margin-bottom:6px">
        소환사명을 10명 입력하면 팀장 선택이 활성화됩니다.
      </div>
      <button id="start-btn" onclick="startGame()" disabled>🚀 드래프트 시작 (LOCK IN)</button>
    </div>
  </div>`;

  // 이름 입력 감시
  for(let i=0;i<10;i++){
    A(`pn${i}`).addEventListener('input', updateLeaders);
  }
}

function updateLeaders(){
  const names = [];
  for(let i=0;i<10;i++){
    const n=(A(`pn${i}`).value||'').trim();
    if(n) names.push(n);
  }
  const dup = names.length !== new Set(names).size;
  const ok  = names.length===10 && !dup;

  A('setup-status').textContent = dup ? '⚠️ 중복된 소환사명이 있습니다.' :
    `${names.length}/10명 입력됨`;

  if(ok){
    A('leader-area').style.display='block';
    const laEl=A('la'), lbEl=A('lb');
    const prev_a=laEl.value, prev_b=lbEl.value;
    laEl.innerHTML = names.map(n=>`<option>${n}</option>`).join('');
    lbEl.innerHTML = names.map(n=>`<option>${n}</option>`).join('');
    if(names.includes(prev_a)) laEl.value=prev_a;
    if(names.includes(prev_b)) lbEl.value=prev_b;
    A('start-btn').disabled=false;
  } else {
    A('leader-area').style.display='none';
    A('start-btn').disabled=true;
  }
}

function startGame(){
  const players=[];
  for(let i=0;i<10;i++){
    const n=(A(`pn${i}`).value||'').trim();
    if(!n) return;
    players.push({name:n, tier:A(`pt${i}`).value, position:A(`pp${i}`).value});
  }
  const la=A('la').value, lb=A('lb').value;
  if(la===lb){ alert('팀장이 같습니다.'); return; }
  send('start_game',{
    players, leader_a:la, leader_b:lb,
    cfg:{
      sp:    parseInt(A('cfg-sp').value),
      tie:   A('cfg-tie').value,
      timer: parseInt(A('cfg-timer').value),
    }
  });
}

// ── 대기 화면 (레드/관전) ─────────────────────────────────────────────────
function renderWaiting(){
  document.getElementById('app').innerHTML=`
  <h1>⚔️ 롤 내전 경매 시스템</h1>
  <div style="max-width:400px;margin:60px auto;text-align:center" class="card">
    <div style="font-size:2em;margin-bottom:12px">⏳</div>
    <div style="color:#ccc">블루팀 팀장이 드래프트를 설정 중입니다...</div>
    <div style="color:#aaa;font-size:.85em;margin-top:8px">방 코드: <b style="color:#C89B3C">${myRoom}</b></div>
  </div>`;
}

// ── 타이머 HTML 빌더 (부분 업데이트용으로 분리) ──────────────────────────
function buildTimerHtml(rem){
  const maxTimer = gs?.cfg?.timer || 30;
  const paused   = gs?.paused;
  const pct      = Math.round(100*rem/maxTimer);
  const danger   = !paused && rem <= 10 && rem > 0;
  const tcolor   = paused ? '#555' : rem > maxTimer*.5 ? '#00C060' : rem > maxTimer*.2 ? '#C89B3C' : '#CF3F3F';
  const label    = paused ? `⏸️ ${rem}s (일시정지)` : `⏱️ ${rem}s`;
  const numSize  = danger ? '2.8em' : '2.2em';
  return `<div class="timer-box${danger?' timer-danger':''}" style="border-color:${tcolor}${danger?';border-width:3px':''}">
    <div class="timer-num" style="color:${tcolor};font-size:${numSize};transition:font-size .2s">${label}</div>
    <div class="timer-bar">
      <div class="timer-fill" style="width:${pct}%;background:${tcolor}"></div>
    </div>
  </div>`;
}

// ── 경매 ──────────────────────────────────────────────────────────────────
function renderAuction(){
  const sp   = gs.cfg?.sp || 100;
  const pool = gs.pool || [];
  if(!pool.length){ renderResult(); return; }

  const player   = pool[0];
  const pinfo    = (gs.all_players||{})[player] || {tier:'언랭',position:'미정'};
  const rem      = gs.timer ?? gs.cfg?.timer ?? 30;

  const turnTeam   = gs.bid_turn === 'blue' ? '🔵 블루팀' : '🔴 레드팀';
  const turnColor  = gs.bid_turn === 'blue' ? '#0AC8B9' : '#E91E63';
  const isMyTurnNow = gs.bid_turn === myRole;
  const turnLabel  = isMyTurnNow ? '⚡ 당신의 입찰 차례!' : `⏳ ${turnTeam} 입찰 중...`;
  const turnHtml   = (myRole !== 'spectator') ? `
  <div style="text-align:center;font-weight:700;font-size:.9em;color:${isMyTurnNow?turnColor:'#aaa'};margin-bottom:4px">
    ${turnLabel}
  </div>` : '';
  const timerHtml = `<div id="timer-display">${buildTimerHtml(rem)}</div>`;

  const tc = TIER_COLOR[pinfo.tier]||'#888';
  const pi = POS_ICON[pinfo.position]||'❓';
  const targetHtml=`
  <div class="target-box">
    <div style="font-size:.8em;color:#aaa;margin-bottom:4px">NEXT CHAMPION</div>
    <div class="target-name">${player}</div>
    <div style="margin-top:6px">
      <span style="color:${tc};font-weight:700">${pinfo.tier}</span>
      &nbsp;&nbsp;
      <span style="color:#aaa">${pi} ${pinfo.position}</span>
    </div>
    <div style="margin-top:6px">
      <span style="color:#aaa;font-size:.85em">남은 선수 </span>
      <span style="color:#C89B3C;font-size:1em;font-weight:900">${pool.length}</span>
      <span style="color:#aaa;font-size:.85em">명</span>
    </div>
  </div>`;

  const lastMsg = gs.last_msg ?
    `<div style="text-align:center;color:#aaa;font-size:.82em;margin:4px 0">최근: ${gs.last_msg}</div>` : '';

  // 입찰 영역 (역할별)
  const bidHtml = buildBidArea();

  // 히스토리 (id 부여 → 열림상태 보존)
  const hist = (gs.history||[]).slice().reverse().map(h=>`
    <div class="hist-item hist-${h.type}">${h.result}</div>`).join('');
  const histHtml = hist ? `
  <details id="det-hist" style="margin-top:8px">
    <summary style="color:#aaa;font-size:.85em;cursor:pointer">📋 기록 (${(gs.history||[]).length}건)</summary>
    <div style="margin-top:4px;max-height:200px;overflow-y:auto">${hist}</div>
  </details>` : '';

  // 팀 패널
  const teamA = buildTeamPanel('a');
  const teamB = buildTeamPanel('b');

  const roleLabel = myRole==='blue'?'🔵 블루팀 팀장':myRole==='red'?'🔴 레드팀 팀장':'👁️ 관전';
  document.getElementById('app').innerHTML=`
  <h1>⚔️ 롤 내전 경매</h1>
  <div style="display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:8px;flex-wrap:wrap">
    <span style="font-size:.8em;color:#555">
      방 코드: <b style="color:#C89B3C;cursor:pointer" onclick="copyCode('${myRoom}')" title="클릭하여 복사">${myRoom} 📋</b>
      &nbsp;|&nbsp;
      <span style="color:${myRole==='blue'?'#0AC8B9':myRole==='red'?'#E91E63':'#888'}">${roleLabel}</span>
    </span>
    ${(myRole==='blue'||myRole==='red') ? `
    <button id="pause-btn" onclick="pauseTimer()"
      style="width:auto;padding:5px 14px;font-size:.82em;margin:0">
      ${gs.paused?'▶️ 재개':'⏸️ 일시정지'}
    </button>` : ''}
    <button onclick="goHome()"
      style="width:auto;padding:5px 14px;font-size:.82em;margin:0;border-color:#555;color:#888">
      🏠 홈
    </button>
  </div>
  <div class="auction-grid">
    ${teamA}
    <div>
      ${turnHtml}${timerHtml}${targetHtml}${lastMsg}${bidHtml}${histHtml}
    </div>
    ${teamB}
  </div>`;
}

function buildBidArea(){
  const sp = gs.cfg?.sp || 100;
  const pa = gs.team_a?.points ?? sp;
  const pb = gs.team_b?.points ?? sp;
  const aPassed = gs.bid_a_passed;
  const bPassed = gs.bid_b_passed;
  const aVal    = gs.bid_a;   // null = 미입찰
  const bVal    = gs.bid_b;

  // 현재 입찰 현황 (항상 표시)
  const aLabel = aPassed ? '❌ 포기' : aVal !== null ? `${aVal}pt` : '-';
  const bLabel = bPassed ? '❌ 포기' : bVal !== null ? `${bVal}pt` : '-';

  // ── 낙찰 결과 표시 중 ──
  if(gs.resolving){
    const winner = (aPassed && bPassed) ? 'tie'
      : aPassed ? 'red' : bPassed ? 'blue'
      : (aVal??0) > (bVal??0) ? 'blue' : (bVal??0) > (aVal??0) ? 'red' : 'tie';
    const aGlow = winner==='blue'?'animation:winner-glow .7s ease forwards;border-color:#00C060;border-width:3px':winner==='red'?'opacity:.45':'';
    const bGlow = winner==='red'?'animation:winner-glow .7s ease forwards;border-color:#00C060;border-width:3px':winner==='blue'?'opacity:.45':'';
    return `
    <div class="bid-area" style="border-color:#C89B3C">
      <div style="text-align:center;color:#aaa;font-size:.85em;margin-bottom:8px">📢 낙찰 결과</div>
      <div class="row" style="align-items:center">
        <div class="bid-reveal blue" style="animation:slide-left .3s ease;${aGlow}">
          🔵 ${aLabel}${winner==='blue'?' 👑':''}
        </div>
        <div style="display:flex;align-items:center;padding:0 8px;color:#888;font-size:1.1em;font-weight:900;flex-shrink:0">vs</div>
        <div class="bid-reveal red" style="animation:slide-right .3s ease;${bGlow}">
          🔴 ${bLabel}${winner==='red'?' 👑':''}
        </div>
      </div>
      ${winner==='tie'?`<div style="text-align:center;color:#C89B3C;margin-top:8px;font-weight:700">⚔️ 동점!</div>`:''}
    </div>`;
  }

  // 현황 바 (입찰 진행 중 항상 표시)
  const standingsHtml = `
  <div class="row" style="margin-bottom:8px;align-items:center">
    <div class="bid-reveal blue" style="font-size:1em;padding:8px">🔵 ${aLabel}</div>
    <div style="display:flex;align-items:center;padding:0 6px;color:#555;font-weight:900;flex-shrink:0">vs</div>
    <div class="bid-reveal red" style="font-size:1em;padding:8px">🔴 ${bLabel}</div>
  </div>`;

  const isMyTurn = gs.bid_turn === myRole;
  const myPts    = myRole==='blue' ? pa : pb;

  // ── 관전자 ──
  if(myRole === 'spectator'){
    const who = gs.bid_turn==='blue'?'🔵 블루팀':'🔴 레드팀';
    return `<div class="bid-area">${standingsHtml}
      <div class="bid-status bid-waiting">⏳ ${who} 결정 중...</div>
    </div>`;
  }

  // ── 내 차례 ──
  if(isMyTurn){
    const color = myRole==='blue'?'#0AC8B9':'#E91E63';
    return `
    <div class="bid-area">
      ${standingsHtml}
      <div style="color:${color};font-size:.9em;font-weight:700;text-align:center;margin-bottom:6px">⚡ 당신의 차례!</div>
      ${buildMyBidInput(myRole, myPts)}
      <button onclick="passBid()" style="margin-top:6px;border-color:#555;color:#888;font-size:.9em">❌ 포기하기</button>
    </div>`;
  }

  // ── 상대 차례 ──
  const waitFor = gs.bid_turn==='blue'?'🔵 블루팀':'🔴 레드팀';
  return `
  <div class="bid-area">
    ${standingsHtml}
    <div class="bid-status bid-waiting">⏳ ${waitFor} 결정 중...</div>
  </div>`;
}

function buildMyBidInput(team, pts){
  const color = team==='blue'?'#0AC8B9':'#E91E63';
  return `
  <div>
    <div style="color:${color};font-size:.85em;margin-bottom:4px">잔여: ${pts}G</div>
    <input id="bid-input" type="number" min="1" max="${pts}" placeholder="1 ~ ${pts}"
      style="color:${color};border-color:${color};text-align:center;font-size:1.1em">
    <button onclick="submitBid()" style="margin-top:8px;border-color:${color};color:${color}">
      ⚡ 입찰 확정
    </button>
  </div>`;
}

function submitBid(){
  const input = A('bid-input');
  const dd    = A('dd-chk');
  if(!input) return;
  const amt = parseInt(input.value);
  const pts = myRole==='blue' ? (gs?.team_a?.points ?? 0) : (gs?.team_b?.points ?? 0);
  if(isNaN(amt) || amt < 1){ alert('1 이상의 숫자를 입력하세요.'); return; }
  if(amt > pts){ alert(`잔여 포인트(${pts}G)를 초과할 수 없습니다.`); return; }
  send('submit_bid',{amount:amt});
}

function buildTeamPanel(team){
  const t       = team==='a' ? gs.team_a : gs.team_b;
  const color   = team==='a' ? '#0AC8B9' : '#E91E63';
  const name    = team==='a' ? '🔵 BLUE TEAM' : '🔴 RED TEAM';
  const cls     = team==='a' ? 'pcard-a' : 'pcard-b';
  const sp      = gs.cfg?.sp || 100;
  const pts     = t?.points ?? sp;
  const spent   = sp - pts;
  const members = t?.members || [];
  let cards='';
  for(let i=0;i<5;i++){
    if(i<members.length){
      const m = members[i];
      const d = (gs.all_players||{})[m]||{tier:'언랭',position:'미정'};
      const tc= TIER_COLOR[d.tier]||'#888';
      const pi= POS_ICON[d.position]||'❓';
      const isLeader = i===0;
      const tierBg = `rgba(${hexToRgb(tc)},${isLeader?.13:.07})`;
      const leaderStyle = isLeader
        ? `border-width:3px;background:${tierBg};box-shadow:0 0 10px rgba(${hexToRgb(tc)},.2)`
        : `background:${tierBg}`;
      cards+=`<div class="pcard ${cls}" style="${leaderStyle}">
        <span style="min-width:24px;font-size:${isLeader?'1em':'.85em'}">${isLeader?'👑':i}</span>
        <span style="flex:1;margin:0 6px;font-size:${isLeader?'1.05em':'.97em'}">${m}</span>
        <span style="color:${tc};font-size:.78em;margin-right:4px;font-weight:700">${d.tier}</span>
        <span style="font-size:.85em;color:#aaa">${pi}</span>
      </div>`;
    } else {
      cards+=`<div class="pcard pcard-empty">Empty Slot</div>`;
    }
  }

  return `
  <div>
    <div class="section-title" style="color:${color}">${name}</div>
    <div class="metric">
      <div class="lbl">GOLD</div>
      <div class="val" style="color:${color}">${pts}G</div>
      ${spent>0?`<div style="font-size:.75em;color:#aaa">-${spent} 소모</div>`:''}
    </div>
    ${cards}
  </div>`;
}

// ── 결과 ──────────────────────────────────────────────────────────────────
function renderResult(){
  const trade   = gs.trade;
  const selA    = gs.sel_a || [];
  const selB    = gs.sel_b || [];
  const canSwap = selA.length===selB.length && selA.length>0;

  const teamA = buildResultTeam('a', trade);
  const teamB = buildResultTeam('b', trade);

  let tradeCenter;
  if(trade){
    const bcolor = canSwap ? '#00C060' : '#C89B3C';
    const txt = canSwap
      ? `🔵 ${selA.length}명 ↔ 🔴 ${selB.length}명  ✅ 교환 가능!`
      : `🔵 ${selA.length}명 선택 ↔ 🔴 ${selB.length}명 선택  (수를 맞춰주세요)`;
    tradeCenter=`
    <div class="trade-status" style="border-color:${bcolor};color:${bcolor}">${txt}</div>
    <div style="color:#aaa;font-size:.82em;text-align:center;margin-bottom:8px">
      양 팀 선수 카드를 클릭해 선택하세요
    </div>
    <button onclick="send('trade_confirm')" ${canSwap?'':'disabled'} style="margin-bottom:6px">
      ✅ 교환 확정
    </button>
    <button onclick="send('trade_cancel')" style="border-color:#888;color:#888">
      ❌ 취소
    </button>`;
  } else {
    tradeCenter=`
    <button onclick="send('trade_start')" style="margin-bottom:6px">🔄 트레이드 시작</button>
    <button onclick="send('reset')" style="border-color:#555;color:#555">🔁 새 게임</button>`;
  }

  const hist = (gs.history||[]).slice().reverse().map(h=>`
    <div class="hist-item hist-${h.type}">${h.result}</div>`).join('');

  document.getElementById('app').innerHTML=`
  <h1>🏆 드래프트 완료!</h1>
  <div style="text-align:center;margin-bottom:6px">
    <button onclick="goHome()"
      style="width:auto;padding:5px 16px;font-size:.82em;border-color:#555;color:#888">
      🏠 홈으로
    </button>
  </div>
  <div style="max-width:960px;margin:0 auto">
    <div class="auction-grid">
      ${teamA}
      <div>
        <div class="card">${tradeCenter}</div>
        ${hist?`
        <details class="card">
          <summary style="cursor:pointer;color:#aaa;font-size:.85em">📋 전체 경매 기록</summary>
          <div style="margin-top:8px">${hist}</div>
        </details>`:''}
      </div>
      ${teamB}
    </div>
  </div>`;
}

function buildResultTeam(team, tradeMode){
  const t      = team==='a' ? gs.team_a : gs.team_b;
  const color  = team==='a' ? '#0AC8B9' : '#E91E63';
  const name   = team==='a' ? '🔵 BLUE TEAM' : '🔴 RED TEAM';
  const cls    = team==='a' ? 'pcard-a' : 'pcard-b';
  const sel    = team==='a' ? (gs.sel_a||[]) : (gs.sel_b||[]);
  const sp     = gs.cfg?.sp || 100;
  const pts    = t?.points ?? sp;
  const spent  = sp - pts;
  const members= t?.members || [];

  let cards='';
  for(let i=0;i<members.length;i++){
    const m  = members[i];
    const d  = (gs.all_players||{})[m]||{tier:'언랭',position:'미정'};
    const tc = TIER_COLOR[d.tier]||'#888';
    const pi = POS_ICON[d.position]||'❓';
    const icon = i===0?'👑':String(i);
    const isSel = sel.includes(m);
    if(tradeMode){
      cards+=`<div class="pcard ${cls} ${isSel?'pcard-sel':''}"
        onclick="send('trade_toggle',{player:'${m}',team:'${team}'})"
        style="cursor:pointer">
        <span style="min-width:24px">${isSel?'✅':icon}</span>
        <span style="flex:1;margin:0 6px">${m}</span>
        <span style="color:${tc};font-size:.78em;margin-right:4px">${d.tier}</span>
        <span style="font-size:.8em;color:#aaa">${pi}${d.position}</span>
      </div>`;
    } else {
      cards+=`<div class="pcard ${cls}">
        <span style="min-width:24px">${icon}</span>
        <span style="flex:1;margin:0 6px">${m}</span>
        <span style="color:${tc};font-size:.78em;margin-right:4px">${d.tier}</span>
        <span style="font-size:.8em;color:#aaa">${pi}${d.position}</span>
      </div>`;
    }
  }

  return `
  <div>
    <div class="section-title" style="color:${color}">${name}</div>
    <div class="metric">
      <div class="lbl">최종 GOLD</div>
      <div class="val" style="color:${color}">${pts}G</div>
      ${spent>0?`<div style="font-size:.75em;color:#aaa">-${spent} 소모</div>`:''}
    </div>
    ${cards}
  </div>`;
}

// ── 초기 렌더 ─────────────────────────────────────────────────────────────
renderHome();
</script>
</body>
</html>
