<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>롤 내전 경매</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:-apple-system,'Segoe UI',sans-serif;min-height:100vh;padding:16px;line-height:1.5;transition:background .25s}
h1,h3{margin-bottom:10px}
button{cursor:pointer;font-weight:700;border:none;width:100%;margin:3px 0;padding:12px 16px;font-size:.95em;transition:.18s ease}
button:disabled{opacity:.4;cursor:not-allowed}
input,select{width:100%;margin:3px 0;padding:9px 12px;font-size:.95em;font-family:inherit;border-radius:2px}
input::placeholder{opacity:.45}
label{font-size:.72em;font-weight:700;display:block;margin:10px 0 4px;text-transform:uppercase;letter-spacing:.08em}
.row{display:flex;gap:8px}
.col{flex:1}
a{color:inherit}
details summary::-webkit-details-marker{display:none}

/* ══════════════════════════════════════════════════════
   후보 A 적용 — 하이텍 테마 (홈 · 로비 · 세팅 · 대기)
   ══════════════════════════════════════════════════════ */
body.theme-hex{
  background:radial-gradient(120% 90% at 50% -10%,#12213D 0%,#0A1428 45%,#050C16 100%) fixed;
  color:#F0E6D2;
}
.hx-wrap{max-width:460px;margin:0 auto}
.hx-hexmark{width:40px;height:40px;margin:26px auto 14px;
  background:linear-gradient(155deg,#F0C46E,#C8AA6E 60%,#785A28);
  clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.hx-eyebrow{text-align:center;font-size:.68em;letter-spacing:.28em;text-transform:uppercase;color:#C8AA6E;font-weight:700;margin-bottom:10px}
.hx-title{text-align:center;font-family:Cambria,"Iowan Old Style",Georgia,serif;font-weight:600;font-size:1.9em;letter-spacing:.02em;text-shadow:0 2px 14px rgba(0,0,0,.5);margin-bottom:4px}
.hx-sub{text-align:center;font-size:.82em;color:#9C9483;margin-bottom:26px}
.hx-panel{border:1px solid #785A28;
  clip-path:polygon(16px 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%,0 16px);
  background:rgba(5,12,22,.55);padding:22px;margin-bottom:16px}
.hx-panel h3{font-family:Cambria,Georgia,serif;font-weight:600;font-size:1.02em;color:#C8AA6E}
.hx-divider{display:flex;align-items:center;gap:10px;color:#785A28;font-size:.7em;letter-spacing:.16em;text-transform:uppercase;margin:22px 0}
.hx-divider::before,.hx-divider::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,transparent,#785A28,transparent)}
body.theme-hex button{
  background:linear-gradient(180deg,#1A2740,#0F1A2E);border:1px solid #C8AA6E;color:#F0C46E;
  font-family:Cambria,Georgia,serif;font-weight:600;letter-spacing:.02em;
  clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
body.theme-hex button:hover:not(:disabled){background:linear-gradient(180deg,#243A5C,#152341);border-color:#F0C46E;box-shadow:0 0 22px rgba(240,196,110,.3)}
body.theme-hex button.ghost{background:transparent;border-color:#4A4638;color:#8C887C;box-shadow:none;clip-path:none;font-family:inherit;font-weight:600}
body.theme-hex button.ghost:hover{border-color:#9C9483;color:#C8AA6E;box-shadow:none}
body.theme-hex input,body.theme-hex select{background:#050C16;border:1px solid #785A28;color:#F0C46E}
body.theme-hex input:focus,body.theme-hex select:focus{outline:none;border-color:#C8AA6E}
body.theme-hex label{color:#9C9483}
body.theme-hex table{width:100%;border-collapse:collapse;font-size:.85em}
body.theme-hex th{background:#050C16;color:#C8AA6E;padding:8px;text-align:left;border:1px solid #785A2833;font-weight:600;text-transform:uppercase;letter-spacing:.04em;font-size:.82em}
body.theme-hex td{padding:5px 6px;border:1px solid #785A2822}
body.theme-hex td input,body.theme-hex td select{margin:0;padding:6px 8px;font-size:.85em}
.hx-code-input{letter-spacing:.4em;text-align:center;font-size:1.1em}
.hx-room-code{font-family:Cambria,Georgia,serif;font-size:2.6em;font-weight:700;letter-spacing:.22em;text-align:center;
  padding:22px 10px;border:1px solid #785A28;
  clip-path:polygon(16px 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%,0 16px);
  color:#C8AA6E;text-shadow:0 0 18px rgba(200,170,110,.5);margin:14px 0;cursor:pointer;user-select:none}
.hx-status-row{display:flex;align-items:center;gap:10px;margin:10px 0;font-size:.9em}
.hx-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}

/* ══════════════════════════════════════════════════════
   후보 B 적용 — 브로드캐스트 테마 (경매 · 결과)
   ══════════════════════════════════════════════════════ */
body.theme-bcast{background:#0D0F12;color:#EDEFF2}
.bc-wrap{max-width:1200px;margin:0 auto}
.bc-topbar{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:14px;flex-wrap:wrap;font-size:.8em;color:#6B7178}
.bc-code b{color:#EDEFF2;cursor:pointer;font-weight:700}
body.theme-bcast button{
  background:#EDEFF2;color:#0D0F12;font-weight:800;letter-spacing:.03em;text-transform:uppercase;font-size:.82em;
  clip-path:polygon(0 0,100% 0,100% 100%,10px 100%,0 calc(100% - 10px))}
body.theme-bcast button:hover:not(:disabled){background:#4EE1FF;box-shadow:0 0 18px rgba(78,225,255,.4)}
body.theme-bcast button.outline{background:transparent;border:1px solid #EDEFF2;color:#EDEFF2;clip-path:none}
body.theme-bcast button.outline:hover{background:#FF4655;border-color:#FF4655;color:#0D0F12;box-shadow:none}
body.theme-bcast button.bare{background:transparent;border:1px solid #2C2E33;color:#9AA0A8;clip-path:none;text-transform:none;font-weight:600;letter-spacing:0}
body.theme-bcast button.bare:hover{border-color:#6B7178;color:#EDEFF2;box-shadow:none}
body.theme-bcast .bc-submit:hover:not(:disabled){filter:brightness(1.15);box-shadow:none}
body.theme-bcast input,body.theme-bcast select{background:#17191D;border:1px solid #2C2E33;color:#EDEFF2}
body.theme-bcast input:focus,body.theme-bcast select:focus{outline:none;border-color:#4EE1FF}

.bc-grid{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:14px;max-width:1200px;margin:0 auto}
@media(max-width:860px){.bc-grid{grid-template-columns:1fr}}

.bc-title{position:relative;text-align:center;padding:22px 0 18px;overflow:hidden}
.bc-title::before,.bc-title::after{content:'';position:absolute;top:0;bottom:0;width:55%}
.bc-title::before{left:-8%;background:linear-gradient(100deg,rgba(78,225,255,.14),transparent 70%)}
.bc-title::after{right:-8%;background:linear-gradient(260deg,rgba(255,70,85,.14),transparent 70%)}
.bc-vs{position:relative;font-weight:900;font-size:.68em;letter-spacing:.32em;color:#6B7178;margin-bottom:6px;text-transform:uppercase}
.bc-h1{position:relative;font-family:"Arial Narrow","Segoe UI",sans-serif;font-weight:900;text-transform:uppercase;font-size:1.7em;transform:skewX(-4deg)}

.bc-panel{background:#17191D;border:1px solid #232529;padding:16px}
.bc-panel-title{font-size:.68em;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#6B7178;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid #232529}
.bc-panel-title.blue{color:#4EE1FF;border-color:#1c3a42}
.bc-panel-title.red{color:#FF4655;border-color:#3a1c20}

.bc-metric{background:#0D0F12;border:1px solid #232529;padding:10px 12px;text-align:center;margin-bottom:10px}
.bc-metric .lbl{font-size:.64em;letter-spacing:.1em;text-transform:uppercase;color:#6B7178}
.bc-metric .val{font-size:1.5em;font-weight:900;font-variant-numeric:tabular-nums}
.bc-metric .bar{background:#232529;height:5px;margin-top:6px}
.bc-metric .bar i{display:block;height:100%;transition:width .5s}

.bc-pcard{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;font-weight:700;font-size:.9em;margin:5px 0;min-height:42px;background:#0D0F12;border-left:3px solid transparent}
.bc-pcard.blue{border-left-color:#4EE1FF}
.bc-pcard.red{border-left-color:#FF4655}
.bc-pcard.empty{border-left-color:#232529;color:#3a3d42;font-style:italic;justify-content:center;font-weight:400}

.bc-timer{border:1px solid #232529;background:#17191D;text-align:center;padding:14px;margin-bottom:10px}
.bc-timer .num{font-size:2.1em;font-weight:900;font-variant-numeric:tabular-nums}
.bc-timer .bar{background:#232529;height:5px;margin-top:8px}
.bc-timer .bar i{display:block;height:100%;transition:width .5s,background .5s}
@keyframes bc-danger{0%,100%{opacity:1}50%{opacity:.55}}
.bc-timer.danger .num{animation:bc-danger .6s ease-in-out infinite}

.bc-target{background:#17191D;border:1px solid #232529;text-align:center;padding:20px 16px;margin-bottom:10px}
.bc-target .eyebrow{font-size:.64em;letter-spacing:.2em;color:#6B7178;text-transform:uppercase;margin-bottom:8px}
.bc-target .name{font-family:"Arial Narrow","Segoe UI",sans-serif;font-weight:900;font-size:2em;text-transform:uppercase}

.bc-bid{background:#17191D;border:1px solid #232529;padding:16px;margin-bottom:10px}
.bc-standings{display:flex;align-items:stretch;gap:1px;background:#232529;margin-bottom:10px}
.bc-standings .cell{flex:1;background:#0D0F12;text-align:center;padding:12px 8px;font-size:1.1em;font-weight:900}
.bc-standings .cell.blue{color:#4EE1FF}
.bc-standings .cell.red{color:#FF4655}
.bc-vsmid{display:flex;align-items:center;padding:0 4px;color:#3a3d42;font-weight:900;flex-shrink:0}

.bc-hist{padding:6px 10px;font-size:.8em;font-weight:600;margin:3px 0;border-left:3px solid;background:#17191D}
.bc-hist.blue{border-color:#4EE1FF}
.bc-hist.red{border-color:#FF4655}
.bc-hist.tie{border-color:#6B7178}
</style>
</head>
<body>
<div id="app"><!-- JS renders here --></div>
<script>
const TIERS=['언랭','아이언','브론즈','실버','골드','플래티넘','에메랄드','다이아','마스터','그랜드마스터','챌린저'];
const POSITIONS=['미정','탑','정글','미드','원딜','서폿'];
const TIER_COLOR={언랭:'#888',아이언:'#8B6355',브론즈:'#AD5600',실버:'#A0A9B8',골드:'#C89B3C',
  플래티넘:'#00B4A0',에메랄드:'#00C060',다이아:'#576BCE',마스터:'#9D4DC3',그랜드마스터:'#CF3F3F',챌린저:'#F4C874'};

let ws=null, myRole=null, myRoom=null, gs=null;

// 렌더 전후 폼 상태 보존용
let _ui = {bid:'', dd:false, details:{}, focused:null};

function _saveUI(){
  const inp = document.getElementById('bid-input');
  const chk = document.getElementById('dd-chk');
  if(inp) _ui.bid = inp.value;
  if(chk) _ui.dd  = chk.checked;
  _ui.focused = document.activeElement ? document.activeElement.id : null;
  document.querySelectorAll('details[id]').forEach(d => {
    _ui.details[d.id] = d.open;
  });
}

function _restoreUI(){
  const inp = document.getElementById('bid-input');
  const chk = document.getElementById('dd-chk');
  if(inp && _ui.bid !== undefined) inp.value = _ui.bid;
  if(chk) chk.checked = _ui.dd;
  document.querySelectorAll('details[id]').forEach(d => {
    if(_ui.details[d.id] !== undefined) d.open = _ui.details[d.id];
  });
  // 포커스 복원
  if(_ui.focused){
    const el = document.getElementById(_ui.focused);
    if(el){
      el.focus();
      if(el.tagName==='INPUT' && el.type!=='checkbox'){
        const len = el.value.length;
        el.setSelectionRange(len, len);
      }
      return;
    }
  }
  // 내 차례가 처음 시작될 때 입찰 입력창 자동 포커스
  const bidInp = document.getElementById('bid-input');
  if(bidInp && gs?.bid_turn === myRole && !gs?.resolving) bidInp.focus();
}

const A = id => document.getElementById(id);
function send(type,data={}){
  if(ws && ws.readyState===1) ws.send(JSON.stringify({type,...data}));
}

function copyCode(code){
  navigator.clipboard.writeText(code).then(()=>{
    const el=document.createElement('div');
    el.textContent='방 코드 복사됨';
    el.style.cssText='position:fixed;top:24px;left:50%;transform:translateX(-50%);background:#00C060;color:#000;padding:9px 20px;border-radius:4px;font-weight:700;z-index:9999';
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),1800);
  });
}

function pauseTimer(){
  send(gs?.paused ? 'resume_timer' : 'pause_timer');
}

function passBid(){
  if(!confirm('정말 포기하시겠습니까?')) return;
  send('pass_bid');
}

function goHome(){
  if(!confirm('홈으로 돌아가면 현재 게임에서 나가집니다. 계속하시겠습니까?')) return;
  if(_reconn.timer){ clearTimeout(_reconn.timer); _reconn.timer=null; }
  _reconn = {active:false, attempts:0, timer:null};
  document.getElementById('reconn-banner')?.remove();
  if(ws) ws.close();
  ws=null; gs=null; myRole=null; myRoom=null;
  _ui={bid:'', dd:false, details:{}, focused:null};
  renderHome();
}

// ── localStorage 설정 저장/복원 ──────────────────────────────────────────
function _saveSetup(){
  try{
    const d={cfg:{},players:[]};
    ['cfg-sp','cfg-tie','cfg-timer'].forEach(id=>{const e=A(id);if(e)d.cfg[id]=e.value;});
    for(let i=0;i<10;i++) d.players.push({
      name:(A(`pn${i}`)?.value||''),
      tier:(A(`pt${i}`)?.value||'언랭'),
      pos:(A(`pp${i}`)?.value||'미정'),
    });
    localStorage.setItem('lol_setup',JSON.stringify(d));
  }catch(e){}
}
function _loadSetup(){
  try{
    const raw=localStorage.getItem('lol_setup');
    if(!raw)return;
    const d=JSON.parse(raw);
    if(d.cfg) Object.entries(d.cfg).forEach(([id,v])=>{const e=A(id);if(e)e.value=v;});
    if(d.players) d.players.forEach((p,i)=>{
      if(A(`pn${i}`))A(`pn${i}`).value=p.name||'';
      if(A(`pt${i}`))A(`pt${i}`).value=p.tier||'언랭';
      if(A(`pp${i}`))A(`pp${i}`).value=p.pos||'미정';
    });
  }catch(e){}
}

// ── 연결 ──────────────────────────────────────────────────────────────────
async function createRoom(){
  const r = await fetch('/api/room',{method:'POST'}).then(r=>r.json());
  myRoom = r.room_id; myRole = 'blue';
  connect();
}

function joinRoom(){
  const code = (A('code-in').value||'').trim().toUpperCase();
  const role = A('role-sel').value;
  if(!code || !role){ alert('방 코드와 역할을 선택해주세요.'); return; }
  myRoom = code; myRole = role;
  connect();
}

let _reconn = {active:false, attempts:0, timer:null};

function _onWsMsg(e){
  const msg = JSON.parse(e.data);
  if(msg.type==='state'){
    if(msg.timer_only){
      gs.timer = msg.d.timer;
      const tEl = document.getElementById('timer-display');
      if(tEl) tEl.innerHTML = buildTimerHtml(gs.timer);
      return;
    }
    document.getElementById('reconn-banner')?.remove();
    _reconn = {active:false, attempts:0, timer:null};
    _saveUI();
    gs=msg.d; myRole=msg.role;
    render();
    _restoreUI();
  }
  else if(msg.type==='error'){ alert(msg.msg); ws=null; gs=null; renderHome(); }
}

function _onWsClose(){
  if(gs && myRoom && myRole && myRole !== 'spectator') _scheduleReconnect();
  else { gs=null; renderHome(); }
}

function _scheduleReconnect(){
  if(_reconn.active) return;
  _reconn.active = true;
  _reconn.attempts = 0;
  _doReconnect();
}

function _doReconnect(){
  if(_reconn.timer){ clearTimeout(_reconn.timer); _reconn.timer=null; }
  _reconn.attempts++;
  if(_reconn.attempts > 5){
    document.getElementById('reconn-banner')?.remove();
    _reconn = {active:false, attempts:0, timer:null};
    gs=null; renderHome(); return;
  }
  let banner = document.getElementById('reconn-banner');
  if(!banner){
    banner = document.createElement('div');
    banner.id = 'reconn-banner';
    banner.style.cssText = 'position:fixed;top:0;left:0;right:0;background:rgba(255,209,102,.12);border-bottom:1px solid #FFD16644;color:#FFD166;text-align:center;padding:7px;font-weight:700;z-index:9999;font-size:.88em';
    document.body.prepend(banner);
  }
  const delay = Math.min(1500 * _reconn.attempts, 8000);
  banner.textContent = `연결 끊김 — ${Math.round(delay/1000)}초 후 재연결 시도 (${_reconn.attempts}/5)`;
  _reconn.timer = setTimeout(()=>{ _reconn.timer=null; connect(); }, delay);
}

function connect(){
  const proto = location.protocol==='https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${proto}//${location.host}/ws/${myRoom}/${myRole}`);
  ws.onmessage = _onWsMsg;
  ws.onclose   = _onWsClose;
  ws.onerror   = () => {};
}

// ── 렌더 라우팅 ───────────────────────────────────────────────────────────
function render(){
  if(!gs){ renderHome(); return; }
  const ph = gs.phase;
  if(ph==='lobby') renderLobby();
  else if(ph==='setup') { if(myRole==='blue') renderSetup(); else renderWaiting(); }
  else if(ph==='auction') renderAuction();
  else if(ph==='result') renderResult();
}

// ══════════════════════════════════════════════════════════════════════════
//  하이텍 테마 화면 — 홈 / 로비 / 세팅 / 대기
// ══════════════════════════════════════════════════════════════════════════
function renderHome(){
  document.body.className = 'theme-hex';
  document.getElementById('app').innerHTML=`
  <div class="hx-wrap">
    <div class="hx-hexmark"></div>
    <p class="hx-eyebrow">Hextech Draft Ledger</p>
    <h1 class="hx-title">롤 내전 경매</h1>
    <p class="hx-sub">친구들과 포인트로 팀을 나누는 경매 드래프트</p>
    <div class="hx-panel">
      <h3>새로 시작</h3>
      <button onclick="createRoom()" style="margin-top:12px">방 개설 — 블루팀 팀장으로 시작</button>
    </div>
    <div class="hx-divider">기존 방 참가</div>
    <div class="hx-panel">
      <label>여섯 자리 방 코드</label>
      <input id="code-in" class="hx-code-input" placeholder="AB3K7P" maxlength="6" style="text-transform:uppercase">
      <label>역할</label>
      <select id="role-sel">
        <option value="">-- 선택 --</option>
        <option value="red">레드팀 팀장</option>
        <option value="spectator">관전자</option>
      </select>
      <button onclick="joinRoom()" style="margin-top:12px">참가하기</button>
    </div>
    <div class="hx-divider">경매 없이 팀 구성</div>
    <div class="hx-panel">
      <h3>밸런싱 모드</h3>
      <p class="hx-sub" style="margin:6px 0 14px;text-align:left">라이엇ID의 솔로랭크 티어·LP와 포지션을 분석해 자동으로 균형 잡힌 5:5 팀을 구성합니다.</p>
      <button onclick="renderBalanceSetup()">밸런싱 모드 시작</button>
    </div>
  </div>`;
}

function renderLobby(){
  document.body.className = 'theme-hex';
  const conn = gs.connected || [];
  const hasBlue = conn.includes('blue');
  const hasRed  = conn.includes('red');
  const row = (c,txt,on) => `<div class="hx-status-row">
    <span class="hx-dot" style="background:${on?c:'#3A3628'}"></span>
    <span style="color:${on?c:'#6B6557'}">${txt}</span>
  </div>`;
  const canStart = myRole==='blue' && hasBlue && hasRed;
  document.getElementById('app').innerHTML=`
  <div class="hx-wrap">
    <div class="hx-hexmark"></div>
    <p class="hx-eyebrow">Draft Room</p>
    <h1 class="hx-title">롤 내전 경매</h1>
    <div class="hx-panel" style="text-align:center">
      <label>방 코드</label>
      <div class="hx-room-code" onclick="copyCode('${gs.room_id}')" title="클릭하여 복사">${gs.room_id}</div>
      <button class="ghost" onclick="copyCode('${gs.room_id}')" style="width:auto;padding:6px 18px;font-size:.8em;display:inline-block">코드 복사</button>
      <p class="hx-sub" style="margin-top:10px">이 코드를 다른 팀원에게 공유하세요</p>
    </div>
    <div class="hx-panel">
      <h3 style="margin-bottom:12px">접속 현황</h3>
      ${row('#0AC8B9','블루팀 팀장 ' + (hasBlue?'접속됨':'대기 중'), hasBlue)}
      ${row('#C8443C','레드팀 팀장 ' + (hasRed ?'접속됨':'대기 중'), hasRed)}

function goToSetup(){
  document.getElementById('app').innerHTML='';
  renderSetup();
}

function renderSetup(){
  document.body.className = 'theme-hex';
  const tOpts = TIERS.map(t=>`<option>${t}</option>`).join('');
  const pOpts = POSITIONS.map(p=>`<option>${p}</option>`).join('');
  let rows='';
  for(let i=0;i<10;i++){
    rows+=`<tr>
      <td style="color:#6B6557;font-size:.8em">${i+1}</td>
      <td><input id="pn${i}" placeholder="소환사명"></td>
      <td><select id="pt${i}">${tOpts}</select></td>
      <td><select id="pp${i}">${pOpts}</select></td>
    </tr>`;
  }
  document.getElementById('app').innerHTML=`
  <div class="hx-wrap" style="max-width:760px">
    <p class="hx-eyebrow" style="margin-top:16px">Draft Setup</p>
    <h1 class="hx-title">드래프트 설정</h1>
    <div class="hx-panel">
      <h3 style="margin-bottom:14px">게임 설정</h3>
      <div class="row">
        <div class="col">
          <label>시작 포인트</label>
          <select id="cfg-sp">${[50,70,100,120,150,200].map(v=>`<option ${v===100?'selected':''}>${v}</option>`).join('')}</select>
        </div>
        <div class="col">
          <label>동점 처리</label>
          <select id="cfg-tie"><option value="random">랜덤 결정</option><option value="reshuffle">뒤로 이동</option></select>
        </div>
        <div class="col">
          <label>타이머 (초)</label>
          <select id="cfg-timer">${[10,15,20,30,45,60].map(v=>`<option ${v===30?'selected':''}>${v}</option>`).join('')}</select>
        </div>
      </div>
    </div>
    <div class="hx-panel">
      <h3 style="margin-bottom:14px">선수 등록 (10명)</h3>
      <table><thead><tr><th>#</th><th>소환사명</th><th>티어</th><th>포지션</th></tr></thead><tbody>${rows}</tbody></table>
    </div>
    <div class="hx-panel" id="leader-area" style="display:none">
      <h3 style="margin-bottom:14px">팀장 선택</h3>
      <div class="row">
        <div class="col"><label>블루팀 팀장</label><select id="la"></select></div>
        <div class="col"><label>레드팀 팀장</label><select id="lb"></select></div>
      </div>
    </div>
    <div class="hx-panel">
      <div id="setup-status" style="color:#9C9483;font-size:.88em;margin-bottom:12px">소환사명을 10명 입력하면 팀장 선택이 활성화됩니다.</div>
      <button id="start-btn" onclick="startGame()" disabled>드래프트 시작 (LOCK IN)</button>
    </div>
  </div>`;

  for(let i=0;i<10;i++){
    A(`pn${i}`).addEventListener('input', updateLeaders);
    A(`pn${i}`).addEventListener('input', _saveSetup);
    A(`pt${i}`).addEventListener('change', _saveSetup);
    A(`pp${i}`).addEventListener('change', _saveSetup);
  }
  ['cfg-sp','cfg-tie','cfg-timer'].forEach(id=>A(id)?.addEventListener('change',_saveSetup));
  _loadSetup();
  updateLeaders();
}

function updateLeaders(){
  const names = [];
  for(let i=0;i<10;i++){
    const n=(A(`pn${i}`).value||'').trim();
    if(n) names.push(n);
  }
  const dup = names.length !== new Set(names).size;
  const ok  = names.length===10 && !dup;

  A('setup-status').textContent = dup ? '중복된 소환사명이 있습니다.' :
    `${names.length}/10명 입력됨`;

  if(ok){
    A('leader-area').style.display='block';
    const laEl=A('la'), lbEl=A('lb');
    const prev_a=laEl.value, prev_b=lbEl.value;
    laEl.innerHTML = names.map(n=>`<option>${n}</option>`).join('');
    lbEl.innerHTML = names.map(n=>`<option>${n}</option>`).join('');
    if(names.includes(prev_a)) laEl.value=prev_a;
    if(names.includes(prev_b)) lbEl.value=prev_b;
    A('start-btn').disabled=false;
  } else {
    A('leader-area').style.display='none';
    A('start-btn').disabled=true;
  }
}

function startGame(){
  const players=[];
  for(let i=0;i<10;i++){
    const n=(A(`pn${i}`).value||'').trim();
    if(!n) return;
    players.push({name:n, tier:A(`pt${i}`).value, position:A(`pp${i}`).value});
  }
  const la=A('la').value, lb=A('lb').value;
  if(la===lb){ alert('팀장이 같습니다.'); return; }
  send('start_game',{
    players, leader_a:la, leader_b:lb,
    cfg:{
      sp:    parseInt(A('cfg-sp').value),
      tie:   A('cfg-tie').value,
      timer: parseInt(A('cfg-timer').value),
    }
  });
}

    <p class="hx-sub">방 코드: <b style="color:#C8AA6E">${myRoom}</b></p>

// ══════════════════════════════════════════════════════════════════════════
//  브로드캐스트 테마 화면 — 경매 / 결과
// ══════════════════════════════════════════════════════════════════════════
function buildTimerHtml(rem){
  const maxTimer = gs?.cfg?.timer || 30;
  const paused   = gs?.paused;
  const pct      = Math.round(100*rem/maxTimer);
  const danger   = !paused && rem <= 10 && rem > 0;
  const tcolor   = paused ? '#6B7178' : rem > maxTimer*.5 ? '#4EE1FF' : rem > maxTimer*.2 ? '#FFD166' : '#FF4655';
  const label    = paused ? `${rem}s · 일시정지` : `${rem}s`;
  return `<div class="bc-timer${danger?' danger':''}">
    <div class="num" style="color:${tcolor}">${label}</div>
    <div class="bar"><i style="width:${pct}%;background:${tcolor}"></i></div>
  </div>`;
}

function renderAuction(){
  document.body.className = 'theme-bcast';
  const pool = gs.pool || [];
  if(!pool.length){ renderResult(); return; }

  const player = pool[0];
  const pinfo  = (gs.all_players||{})[player] || {tier:'언랭',position:'미정'};
  const rem    = gs.timer ?? gs.cfg?.timer ?? 30;

  const turnTeam    = gs.bid_turn === 'blue' ? '블루팀' : '레드팀';
  const turnColor   = gs.bid_turn === 'blue' ? '#4EE1FF' : '#FF4655';
  const isMyTurnNow = gs.bid_turn === myRole;
  const turnLabel   = isMyTurnNow ? '당신의 입찰 차례' : `${turnTeam} 입찰 중...`;
  const turnHtml    = (myRole !== 'spectator') ? `
  <div style="text-align:center;font-weight:800;font-size:.8em;letter-spacing:.06em;text-transform:uppercase;color:${isMyTurnNow?turnColor:'#6B7178'};margin-bottom:6px">
    ${turnLabel}
  </div>` : '';
  const timerHtml = `<div id="timer-display">${buildTimerHtml(rem)}</div>`;

  const targetHtml = `
  <div class="bc-target">
    <div class="eyebrow">Next Pick · 남은 ${pool.length}명</div>
    <div class="name">${player}</div>
    <div style="margin-top:8px;font-size:.85em;color:#9AA0A8">
      <span style="color:${TIER_COLOR[pinfo.tier]||'#9AA0A8'};font-weight:700">${pinfo.tier}</span> · ${pinfo.position}
    </div>
  </div>`;

  const lastMsg = gs.last_msg ?

  const bidHtml = buildBidArea();

  const hist = (gs.history||[]).slice().reverse().map(h=>`
    <div class="bc-hist ${h.type}">${h.result}</div>`).join('');
  const histHtml = hist ? `
  <details id="det-hist" style="margin-top:10px">
    <summary style="color:#6B7178;font-size:.82em;cursor:pointer;font-weight:600">기록 (${(gs.history||[]).length}건)</summary>
    <div style="margin-top:6px;max-height:200px;overflow-y:auto">${hist}</div>
  </details>` : '';

  const teamA = buildTeamPanel('a');
  const teamB = buildTeamPanel('b');

  const roleLabel = myRole==='blue'?'블루팀 팀장':myRole==='red'?'레드팀 팀장':'관전';
  document.getElementById('app').innerHTML=`
  <div class="bc-wrap">
    <div class="bc-title">
      <div class="bc-vs">Order · V · Chaos</div>
      <div class="bc-h1">롤 내전 경매</div>
    </div>
    <div class="bc-topbar">
      <span class="bc-code">방 코드 <b onclick="copyCode('${myRoom}')" title="클릭하여 복사">${myRoom}</b></span>
      <span style="color:${myRole==='blue'?'#4EE1FF':myRole==='red'?'#FF4655':'#6B7178'}">${roleLabel}</span>
      ${(myRole==='blue'||myRole==='red') ? `
      <button class="bare" onclick="pauseTimer()" style="width:auto;padding:6px 14px">
        ${gs.paused?'재개':'일시정지'}
      </button>` : ''}
      <button class="bare" onclick="goHome()" style="width:auto;padding:6px 14px">홈</button>
    </div>
    <div class="bc-grid">
      ${teamA}
      <div>
        ${turnHtml}${timerHtml}${targetHtml}${lastMsg}${bidHtml}${histHtml}
      </div>
      ${teamB}
    </div>
  </div>`;
}

function buildBidArea(){
  const sp = gs.cfg?.sp || 100;
  const pa = gs.team_a?.points ?? sp;
  const pb = gs.team_b?.points ?? sp;
  const aPassed = gs.bid_a_passed;
  const bPassed = gs.bid_b_passed;
  const aVal    = gs.bid_a;
  const bVal    = gs.bid_b;

  const aLabel = aPassed ? '포기' : aVal !== null ? `${aVal}pt` : '—';
  const bLabel = bPassed ? '포기' : bVal !== null ? `${bVal}pt` : '—';

  if(gs.resolving){
    const winner = (aPassed && bPassed) ? 'tie'
      : aPassed ? 'red' : bPassed ? 'blue'
      : (aVal??0) > (bVal??0) ? 'blue' : (bVal??0) > (aVal??0) ? 'red' : 'tie';
    return `
    <div class="bc-bid">
      <div style="text-align:center;color:#6B7178;font-size:.76em;text-transform:uppercase;letter-spacing:.12em;margin-bottom:10px">낙찰 결과</div>
      <div class="bc-standings">
        <div class="cell blue" style="${winner==='blue'?'box-shadow:inset 0 0 0 2px #4EE1FF':winner==='red'?'opacity:.4':''}">${aLabel}${winner==='blue'?' ★':''}</div>
        <div class="bc-vsmid">VS</div>
        <div class="cell red" style="${winner==='red'?'box-shadow:inset 0 0 0 2px #FF4655':winner==='blue'?'opacity:.4':''}">${bLabel}${winner==='red'?' ★':''}</div>
      </div>
      ${winner==='tie'?`<div style="text-align:center;color:#FFD166;font-weight:700">동점!</div>`:''}
    </div>`;
  }

  const standingsHtml = `
  <div class="bc-standings">
    <div class="cell blue">${aLabel}</div>
    <div class="bc-vsmid">VS</div>
    <div class="cell red">${bLabel}</div>
  </div>`;

  const isMyTurn = gs.bid_turn === myRole;
  const myPts    = myRole==='blue' ? pa : pb;

  if(myRole === 'spectator'){
    const who = gs.bid_turn==='blue'?'블루팀':'레드팀';
    return `<div class="bc-bid">${standingsHtml}
      <div style="text-align:center;color:#6B7178;font-size:.85em;padding:8px 0">${who} 결정 중...</div>
    </div>`;
  }

  if(isMyTurn){
    const color = myRole==='blue'?'#4EE1FF':'#FF4655';
    return `
    <div class="bc-bid">
      ${standingsHtml}
      <div style="color:${color};font-size:.8em;font-weight:800;text-align:center;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px">당신의 차례</div>
      ${buildMyBidInput(myRole, myPts)}
      <button class="bare" onclick="passBid()" style="margin-top:8px">포기하기</button>
    </div>`;
  }

  const waitFor = gs.bid_turn==='blue'?'블루팀':'레드팀';
  return `
  <div class="bc-bid">
    ${standingsHtml}
    <div style="text-align:center;color:#6B7178;font-size:.85em;padding:8px 0">${waitFor} 결정 중...</div>
  </div>`;
}

function buildMyBidInput(team, pts){
  const color  = team==='blue'?'#4EE1FF':'#FF4655';
  const oppBid = team==='blue' ? gs.bid_b : gs.bid_a;
  const minBid = (oppBid !== null && oppBid !== undefined) ? oppBid+1 : 1;
  const hint   = (oppBid !== null && oppBid !== undefined) ? ` · 최소 ${minBid}pt` : '';
  return `
  <div>
    <div style="color:${color};font-size:.82em;margin-bottom:6px">잔여 ${pts}G${hint}</div>
    <input id="bid-input" type="number" min="${minBid}" max="${pts}" placeholder="${minBid} ~ ${pts}"
      onkeydown="if(event.key==='Enter')submitBid()"
      style="color:${color};border-color:${color};text-align:center;font-size:1.1em;font-weight:800">
    <button class="bc-submit" onclick="submitBid()" style="margin-top:8px;background:${color};color:#0D0F12">
      입찰 확정
    </button>
  </div>`;
}

function submitBid(){
  const input = A('bid-input');
  if(!input) return;
  const amt    = parseInt(input.value);
  const pts    = myRole==='blue' ? (gs?.team_a?.points ?? 0) : (gs?.team_b?.points ?? 0);
  const oppBid = myRole==='blue' ? gs?.bid_b : gs?.bid_a;
  const minBid = (oppBid !== null && oppBid !== undefined) ? oppBid+1 : 1;
  if(isNaN(amt) || amt < minBid){ alert(`${minBid}pt 이상 입찰해야 합니다.`); return; }
  if(amt > pts){ alert(`잔여 포인트(${pts}G)를 초과할 수 없습니다.`); return; }
  send('submit_bid',{amount:amt});
}

function buildTeamPanel(team){
  const t       = team==='a' ? gs.team_a : gs.team_b;
  const color   = team==='a' ? '#4EE1FF' : '#FF4655';
  const name    = team==='a' ? 'BLUE TEAM' : 'RED TEAM';
  const cls     = team==='a' ? 'blue' : 'red';
  const sp      = gs.cfg?.sp || 100;
  const pts     = t?.points ?? sp;
  const spent   = sp - pts;
  const members = t?.members || [];
  let cards='';
  for(let i=0;i<5;i++){
    if(i<members.length){
      const m = members[i];
      const d = (gs.all_players||{})[m]||{tier:'언랭',position:'미정'};
      const isLeader = i===0;
      cards+=`<div class="bc-pcard ${cls}" style="${isLeader?'border-left-width:5px':''}">
        <span style="min-width:16px;font-size:.8em;color:#6B7178">${isLeader?'★':i}</span>
        <span style="flex:1;margin:0 8px;color:#EDEFF2">${m}</span>
        <span style="font-size:.75em;text-align:right">
          <span style="color:${TIER_COLOR[d.tier]||'#9AA0A8'};font-weight:700">${d.tier}</span>
          <span style="color:#6B7178"> · ${d.position}</span>
        </span>
      </div>`;
    } else {
      cards+=`<div class="bc-pcard empty">Empty Slot</div>`;
    }
  }

  return `
  <div>
    <div class="bc-panel-title ${cls}">${name}</div>
    <div class="bc-metric">
      <div class="lbl">Gold</div>
      <div class="val" style="color:${color}">${pts}G</div>
      <div class="bar"><i style="width:${Math.round(100*pts/sp)}%;background:${color}"></i></div>
      ${spent>0?`<div style="font-size:.68em;color:#6B7178;margin-top:4px">-${spent} 소모</div>`:''}
    </div>
    ${cards}
  </div>`;
}

function renderResult(){
  document.body.className = 'theme-bcast';
  const trade   = gs.trade;
  const selA    = gs.sel_a || [];
  const selB    = gs.sel_b || [];
  const canSwap = selA.length===selB.length && selA.length>0;

  const teamA = buildResultTeam('a', trade);
  const teamB = buildResultTeam('b', trade);

  let tradeCenter;
  if(trade){
    const bcolor = canSwap ? '#4EE1FF' : '#FFD166';
    const txt = canSwap
      ? `블루 ${selA.length}명 ↔ 레드 ${selB.length}명 · 교환 가능`
      : `블루 ${selA.length}명 선택 ↔ 레드 ${selB.length}명 선택 (수를 맞춰주세요)`;
    tradeCenter=`
    <div style="text-align:center;padding:12px;border:1px solid ${bcolor};color:${bcolor};font-weight:700;margin-bottom:10px">${txt}</div>
    <div style="color:#6B7178;font-size:.8em;text-align:center;margin-bottom:10px">양 팀 선수 카드를 클릭해 선택하세요</div>
    <button onclick="send('trade_confirm')" ${canSwap?'':'disabled'} style="margin-bottom:8px">
      교환 확정
    </button>
    <button class="outline" onclick="send('trade_cancel')">취소</button>`;
  } else {
    tradeCenter=`
    <button onclick="send('trade_start')" style="margin-bottom:8px">트레이드 시작</button>
    <button class="bare" onclick="send('reset')">새 게임</button>`;
  }

  const hist = (gs.history||[]).slice().reverse().map(h=>`
    <div class="bc-hist ${h.type}">${h.result}</div>`).join('');

  document.getElementById('app').innerHTML=`
  <div class="bc-wrap">
    <div class="bc-title">
      <div class="bc-vs">Draft Complete</div>
      <div class="bc-h1">최종 결과</div>
    </div>
    <div style="text-align:center;margin-bottom:12px">
      <button class="bare" onclick="goHome()" style="width:auto;padding:6px 16px">홈으로</button>
    </div>
    <div class="bc-grid">
      ${teamA}
      <div>
        <div class="bc-panel">${tradeCenter}</div>
        ${hist?`
        <details class="bc-panel" style="margin-top:10px">
          <summary style="cursor:pointer;color:#6B7178;font-size:.82em;font-weight:600">전체 경매 기록</summary>
          <div style="margin-top:8px">${hist}</div>
        </details>`:''}
      </div>
      ${teamB}
    </div>
  </div>`;
}

function buildResultTeam(team, tradeMode){
  const t      = team==='a' ? gs.team_a : gs.team_b;
  const color  = team==='a' ? '#4EE1FF' : '#FF4655';
  const name   = team==='a' ? 'BLUE TEAM' : 'RED TEAM';
  const cls    = team==='a' ? 'blue' : 'red';
  const sel    = team==='a' ? (gs.sel_a||[]) : (gs.sel_b||[]);
  const sp     = gs.cfg?.sp || 100;
  const pts    = t?.points ?? sp;
  const spent  = sp - pts;
  const members= t?.members || [];

  let cards='';
  for(let i=0;i<members.length;i++){
    const m  = members[i];
    const d  = (gs.all_players||{})[m]||{tier:'언랭',position:'미정'};
    const isLeader = i===0;
    const isSel = sel.includes(m);
    const marker = isSel ? '✓' : (isLeader ? '★' : String(i));
    cards+=`<div class="bc-pcard ${cls}"
      style="${isLeader?'border-left-width:5px':''}${tradeMode?`cursor:pointer;${isSel?'background:#1c1e22':''}`:''}"
      ${tradeMode?`onclick="send('trade_toggle',{player:'${m}',team:'${team}'})"`:''}>
      <span style="min-width:16px;font-size:.8em;color:${isSel?color:'#6B7178'}">${marker}</span>
      <span style="flex:1;margin:0 8px;color:#EDEFF2">${m}</span>
      <span style="font-size:.75em;text-align:right">
        <span style="color:${TIER_COLOR[d.tier]||'#9AA0A8'};font-weight:700">${d.tier}</span>
        <span style="color:#6B7178"> · ${d.position}</span>
      </span>
    </div>`;
  }

  return `
  <div>
    <div class="bc-panel-title ${cls}">${name}</div>
    <div class="bc-metric">
      <div class="lbl">최종 Gold</div>
      <div class="val" style="color:${color}">${pts}G</div>
      ${spent>0?`<div style="font-size:.68em;color:#6B7178;margin-top:4px">-${spent} 소모</div>`:''}
    </div>
    ${cards}
  </div>`;
}

// ══════════════════════════════════════════════════════════════════════════
//  밸런싱 모드 — 라이엇 API 기반 자동 팀 구성 (등록: 하이텍 / 결과: 브로드캐스트)
// ══════════════════════════════════════════════════════════════════════════
function renderBalanceSetup(){
  document.body.className = 'theme-hex';
  const pOpts = POSITIONS.map(p=>`<option>${p}</option>`).join('');
  const tOpts = TIERS.map(t=>`<option>${t}</option>`).join('');
  let rows='';
  for(let i=0;i<10;i++){
    rows+=`<tr>
      <td style="color:#6B6557;font-size:.8em">${i+1}</td>
      <td><input id="bn${i}" placeholder="소환사명"></td>
      <td><input id="brid${i}" placeholder="게임명#태그"></td>
      <td><select id="bp${i}">${pOpts}</select></td>
      <td><select id="bt${i}">${tOpts}</select></td>
      <td id="binfo${i}" style="font-size:.76em;color:#6B6557;white-space:nowrap">—</td>
    </tr>`;
  }
  document.getElementById('app').innerHTML=`
  <div class="hx-wrap" style="max-width:920px">
    <p class="hx-eyebrow" style="margin-top:16px">Auto Balance</p>
    <h1 class="hx-title">밸런싱 모드</h1>
    <p class="hx-sub">라이엇ID(예: Hide on bush#KR1)를 조회하면 솔로랭크 티어·LP를 자동으로 불러옵니다.
    조회 실패·언랭인 경우 티어를 직접 선택해 보정하세요.</p>
    <div class="hx-panel">
      <h3 style="margin-bottom:14px">선수 등록 (10명)</h3>
      <div style="overflow-x:auto">
      <table>
        <thead><tr><th>#</th><th>소환사명</th><th>라이엇ID</th><th>포지션</th><th>티어</th><th>조회 결과</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      </div>
      <button id="lookup-btn" onclick="doLookup()" style="margin-top:14px">전적 조회</button>
    </div>
    <div class="hx-panel">
      <div id="bal-status" style="color:#9C9483;font-size:.88em;margin-bottom:12px">
        소환사명·라이엇ID 10명을 입력하고 전적을 조회하세요.
      </div>
      <button id="compute-btn" onclick="doCompute()" disabled>팀 구성하기</button>
    </div>
    <button class="ghost" onclick="renderHome()">메인 화면으로</button>
  </div>`;

  for(let i=0;i<10;i++){
    A(`bt${i}`).addEventListener('change', ()=>{
      const infoEl = A(`binfo${i}`);
      infoEl.dataset.rank=''; infoEl.dataset.lp='0';
      infoEl.innerHTML = `<span style="color:#C8AA6E">수동 설정</span>`;
    });
  }
}

async function doLookup(){
  const names=[], riotIds=[];
  for(let i=0;i<10;i++){
    const n=(A(`bn${i}`).value||'').trim();
    const r=(A(`brid${i}`).value||'').trim();
    if(!n || !r){ alert('모든 선수의 소환사명과 라이엇ID(게임명#태그)를 입력해주세요.'); return; }
    names.push(n); riotIds.push(r);
  }
  if(new Set(names).size !== 10){ alert('소환사명이 중복되었습니다.'); return; }

  const btn = A('lookup-btn');
  btn.disabled = true; btn.textContent = '조회 중... (수 초 소요)';
  try{
    const res = await fetch('/api/balance/lookup', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({players: names.map((n,i)=>({name:n, riot_id:riotIds[i]}))})
    });
    if(!res.ok){
      const e = await res.json().catch(()=>({}));
      alert('조회 실패: ' + (e.detail || res.status));
      return;
    }
    const data = await res.json();
    data.players.forEach((p,i)=>{
      const infoEl = A(`binfo${i}`);
      const tSel   = A(`bt${i}`);
      if(p.ok){
        tSel.value = p.tier_ko;
        infoEl.dataset.rank = p.rank || '';
        infoEl.dataset.lp   = String(p.lp || 0);
        const rk = p.rank ? ` ${p.rank}` : '';
        const wl = p.tier !== 'UNRANKED' ? ` · ${p.wins}승 ${p.losses}패` : '';
        infoEl.innerHTML = `<span style="color:${TIER_COLOR[p.tier_ko]||'#9C9483'}">${p.tier_ko}${rk} ${p.lp}LP</span>${wl}`;
      } else {
        infoEl.dataset.rank=''; infoEl.dataset.lp='0';
        infoEl.innerHTML = `<span style="color:#C8443C">${p.error}</span>`;
      }
    });
    A('bal-status').textContent = '조회 완료. 필요하면 티어를 직접 수정한 뒤 팀을 구성하세요.';
    A('compute-btn').disabled = false;
  } finally {
    btn.disabled = false; btn.textContent = '전적 조회';
  }
}

async function doCompute(){
  const players=[];
  for(let i=0;i<10;i++){
    const name     = (A(`bn${i}`).value||'').trim();
    const position = A(`bp${i}`).value;
    const tier_ko  = A(`bt${i}`).value;
    const infoEl   = A(`binfo${i}`);
    const rank = infoEl.dataset.rank || null;
    const lp   = parseInt(infoEl.dataset.lp || '0') || 0;
    players.push({name, position, tier_ko, rank, lp});
  }
  const btn = A('compute-btn');
  btn.disabled = true; btn.textContent = '계산 중...';
  try{
    const res = await fetch('/api/balance/compute', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({players})
    });
    if(!res.ok){
      const e = await res.json().catch(()=>({}));
      alert('계산 실패: ' + (e.detail || res.status));
      return;
    }
    renderBalanceResult(await res.json());
  } finally {
    btn.disabled = false; btn.textContent = '팀 구성하기';
  }
}

function renderBalanceResult(result){
  document.body.className = 'theme-bcast';
  const buildTeam = (team, totalScore, color, label) => {
    const cls = color === '#4EE1FF' ? 'blue' : 'red';
    const cards = team.map((p,i)=>{
      const mismatch = p.position !== '미정' && p.position !== p.assigned_position;
      return `<div class="bc-pcard ${cls}">
        <span style="min-width:16px;font-size:.8em;color:#6B7178">${i}</span>
        <span style="flex:1;margin:0 8px;color:#EDEFF2">${p.name}${mismatch?` <span style="color:#FFD166;font-size:.85em">(희망 ${p.position})</span>`:''}</span>
        <span style="font-size:.75em;text-align:right">
          <span style="color:${TIER_COLOR[p.tier_ko]||'#9AA0A8'};font-weight:700">${p.tier_ko}</span>
          <span style="color:#6B7178"> · ${p.assigned_position}</span>
        </span>
      </div>`;
    }).join('');
    return `
    <div>
      <div class="bc-panel-title ${cls}">${label}</div>
      <div class="bc-metric">
        <div class="lbl">Power Score</div>
        <div class="val" style="color:${color}">${totalScore}</div>
      </div>
      ${cards}
    </div>`;
  };

  const scoreDiff = Math.abs(result.score_a - result.score_b);
  document.getElementById('app').innerHTML=`
  <div class="bc-wrap">
    <div class="bc-title">
      <div class="bc-vs">Auto Balance Result</div>
      <div class="bc-h1">밸런싱 결과</div>
    </div>
    <div style="text-align:center;margin-bottom:14px;color:#9AA0A8;font-size:.85em">
      포지션 희망 불일치 <b style="color:${result.mismatches?'#FF4655':'#4EE1FF'}">${result.mismatches}건</b>
      &nbsp;·&nbsp; 팀 간 점수 차이 <b style="color:#EDEFF2">${scoreDiff}</b>
    </div>
    <div class="bc-grid">
      ${buildTeam(result.team_a, result.score_a, '#4EE1FF', 'BLUE TEAM')}
      <div>
        <div class="bc-panel" style="display:flex;flex-direction:column;gap:8px">
          <button onclick="renderBalanceSetup()">선수 다시 설정</button>
          <button class="bare" onclick="renderHome()">홈으로</button>
        </div>
      </div>
      ${buildTeam(result.team_b, result.score_b, '#FF4655', 'RED TEAM')}
    </div>
  </div>`;
}

// ── 초기 렌더 ─────────────────────────────────────────────────────────────
renderHome();
</script>
</body>
</html>
